<style>
:root {
  --bg: #f6efe6;
  --card: #A26F4E;
  --ink: #fff6ee;
  --muted: #f0dccb;
  --accent: #4a2c18;
  --accent-ink: #ffffff;
  --btn: #f3d9b1;
  --btn-ink: #3b2416;
  --gold: #c9a227;
  --head: clamp(54px, 9vmin, 68px);
  --line: rgba(255, 255, 255, 0.35);
  --shade: rgba(40, 24, 14, 0.6);
  color-scheme: light;
}
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: transparent; }
/* Sirf Question aur (khula hua) Answer select/copy ho sakte hain */
.question,
.answer.open {
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}
.question::selection,
.answer.open::selection {
  background: rgba(201, 162, 39, 0.45);
}
button { touch-action: manipulation; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(var(--head) + 18px) 14px 32px;
}
main {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}
.brand {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 4;
  height: var(--head);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--card);
  border-bottom: 4px solid var(--gold);
  box-shadow: 0 6px 18px rgba(46, 28, 16, 0.3);
}
.brand-name {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(22px, 5.4vmin, 30px);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #fff6ee;
  text-shadow: 0 2px 4px rgba(46, 28, 16, 0.35);
}
.brand-name .amp {
  color: #f3d9b1;
  font-style: italic;
  padding: 0 0.1em;
}
.brand-palm {
  display: block;
  height: clamp(28px, 6.6vmin, 38px);
  width: auto;
  pointer-events: none;
}
.brand-icons {
  font-size: clamp(22px, 5.4vmin, 30px);
  line-height: 1;
}
.feed {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sentinel { height: 1px; }
.end {
  margin: 20px 0 0;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: #7a5a44;
}

.card[hidden] { display: none; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 5px solid var(--gold);
  border-radius: 18px;
  --pad: clamp(18px, 4vmin, 26px);
  padding: var(--pad);
  display: flex;
  flex-direction: column;
  width: 100%;
  box-shadow: 0 12px 32px rgba(46, 28, 16, 0.22);
}
.card.qa {
  --cship: min(124px, 30vw);
  position: relative;
  overflow: hidden;
}
.card-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: calc(var(--cship) * 0.75);
  margin: 0 0 calc(var(--pad) * -1) calc(var(--pad) * -1);
}
.card-ship {
  flex: none;
  width: calc(var(--cship) * 0.75);
  height: calc(var(--cship) * 0.75);
  object-fit: contain;
  margin-left: 6px;
  pointer-events: none;
}
.label {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.question {
  margin: 0 0 clamp(16px, 3dvh, 24px);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(19px, 4.6vmin, 28px);
  line-height: 1.35;
  font-weight: 700;
}
.answer {
  margin: 0 0 clamp(10px, 2.4dvh, 24px);
  padding: clamp(10px, 2vmin, 18px) clamp(10px, 2vmin, 16px);
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(46, 28, 16, 0.14);
  font-size: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.answer.locked {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
  filter: blur(7px);
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
}
.answer.open {
  background: rgba(201, 162, 39, 0.12);
  border-color: var(--gold);
}
button {
  font: inherit;
  font-weight: 600;
  font-size: clamp(15px, 3.4vmin, 17px);
  padding: clamp(10px, 2.2vmin, 14px) 24px;
  border: 0;
  border-radius: 10px;
  background: var(--btn);
  color: var(--btn-ink);
  cursor: pointer;
}
button:disabled { opacity: 0.55; cursor: not-allowed; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.unlock {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.unlock.sponsor {
  cursor: default;
  pointer-events: none;
}
.unlock svg {
  width: 22px;
  height: 22px;
  flex: none;
}
</style>
</head>

  var observer = null;
  var freeMode = false;

  function make(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) {
      node.className = cls;
    }
    if (text !== undefined) {
      node.textContent = text;
    }
    return node;
  }

  function makeFoot(btn) {
    var foot = make("div", "card-foot");
    var ship = make("img", "card-ship");
    ship.alt = "";
    ship.src = SHIP_SRC;
    foot.appendChild(ship);
    foot.appendChild(btn);
    return foot;
  }

  function buildCard(item) {
    var card = make("article", "card qa");
    var answer = make("div", "answer locked", item.answer);
    var btn = make("button", "unlock");
    answer.setAttribute("aria-live", "polite");
    btn.type = "button";
    btn.innerHTML = "<span>Show Answer</span>" + EYE;
    btn.addEventListener("click", function () {
      toggleAnswer(item);
    });
    card.appendChild(make("p", "label", "Question"));
    card.appendChild(make("h2", "question", item.question));
    card.appendChild(make("p", "label", "Answer"));
    card.appendChild(answer);
    card.appendChild(makeFoot(btn));
    item.answerEl = answer;
    item.btn = btn;
    if (freeMode) {
      toggleAnswer(item);
    }
    return card;
  }

  function renderBatch() {
    var stop = Math.min(shown + BATCH, list.length);
    var frag = document.createDocumentFragment();
    for (var i = shown; i < stop; i++) {
      frag.appendChild(buildCard(list[i]));
    }
    feedEl.appendChild(frag);
    shown = stop;
    if (shown >= list.length) {
      if (observer) {
        observer.disconnect();
      }
      sentinelEl.style.display = "none";
      endEl.hidden = false;
    }
  }

  function loadMore() {
    if (shown >= list.length) {
      return;
    }
    renderBatch();
    if (observer && shown < list.length) {
      observer.unobserve(sentinelEl);
      observer.observe(sentinelEl);
    }
  }

  function toggleAnswer(item) {
    item.visible = !item.visible;
    item.answerEl.classList.toggle("locked", !item.visible);
    item.answerEl.classList.toggle("open", item.visible);
    item.btn.innerHTML = item.visible ? "<span>Hide Answer</span>" + EYE_OFF : "<span>Show Answer</span>" + EYE;
  }

  renderBatch();

  // Popunder load na hone par: saare answers khol do (abhi wale bhi aur baad mein load hone wale bhi)
  window.revealAllAnswers = function () {
    freeMode = true;
    list.forEach(function (item) {
      if (item.answerEl && !item.visible) {
        toggleAnswer(item);
      }
    });
  };

  if ("IntersectionObserver" in window) {
    observer = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) {
        loadMore();
      }
    }, { rootMargin: "0px 0px 120px 0px" });
    if (shown < list.length) {
      observer.observe(sentinelEl);
    }
  } else {
    window.addEventListener("scroll", function () {
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 200) {
        loadMore();
      }
    });
  }

  // Sirf question aur khule hue answer mein selection allowed hai
  function canSelect(target) {
    var el = target && target.nodeType === 3 ? target.parentElement : target;
    return !!(el && el.closest && el.closest(".question, .answer.open"));
  }
  document.addEventListener("selectstart", function (e) {
    if (!canSelect(e.target)) {
      e.preventDefault();
    }
  });
  document.addEventListener("mousedown", function (e) {
    if (e.detail > 1 && !canSelect(e.target)) {
      e.preventDefault();
    }
  });
})();
</script>

<script>
(function () {
  var KEY = "popunderLastShown";
  var MODE_KEY = "popunderMode";
  var COOLDOWN = 13 * 60 * 60 * 1000;
  var last = 0;
  var mode = "";

  try {
    last = parseInt(localStorage.getItem(KEY), 10) || 0;
    mode = localStorage.getItem(MODE_KEY) || "";
  } catch (e) {}

  function revealFree() {
    try {
      if (typeof window.revealAllAnswers === "function") {
        window.revealAllAnswers();
      }
    } catch (e) {}
  }

  function save(value) {
    try {
      localStorage.setItem(KEY, String(Date.now()));
      localStorage.setItem(MODE_KEY, value);
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadPopunder() {
    var tag = document.createElement("script");
    tag.setAttribute("data-cfasync", "false");
    tag.src = "https://afders.org/1/3155741d73a294fb867f97844bf582a9";
    tag.onerror = revealFree;
    document.body.appendChild(tag);
  }

  // Purane "fresh" (ad-free) wale users ko bhi ab new user ki tarah treat karo
  if (mode === "fresh") {
    last = 0;
  }

  if (last && Date.now() - last < COOLDOWN) {
    revealFree();
    return;
  }

  save("shown");
  loadPopunder();
})();
</script>

<!-- //////////////////////////////////////////////////////// -->
  
<script>
(function () {
  var HOST = "afders.org";
  var needRefresh = false;
  var loaderActive = false;

  function popunderLoaded() {
    var tag = Array.from(document.scripts).some(function (s) {
      return s.src && s.src.indexOf(HOST) > -1;
    });
    var loaded = performance.getEntriesByType("resource").some(function (e) {
      return e.name.indexOf(HOST) > -1;
    });
    return tag && loaded;
  }

  // ---- New tab / window blocking (loader ke dauran) ----
  function blockEvent(e) {
    if (!loaderActive) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    e.stopPropagation();
  }

  function enableBlocking() {
    loaderActive = true;

    // 1. window.open ko disable karo
    window.open = function () { return null; };
    try {
      Object.defineProperty(window, "open", {
        value: function () { return null; },
        writable: false,
        configurable: false
      });
    } catch (e) {}

    // 2. Programmatic a.click() aur form.submit() block
    HTMLAnchorElement.prototype.click = function () {};
    HTMLFormElement.prototype.submit = function () {};
    HTMLFormElement.prototype.requestSubmit = function () {};

    // 3. Saare user events capture phase mein rok do
    [
      "click", "auxclick", "dblclick", "mousedown", "mouseup",
      "pointerdown", "pointerup", "touchstart", "touchend",
      "submit", "contextmenu", "keydown", "keyup"
    ].forEach(function (type) {
      window.addEventListener(type, blockEvent, { capture: true, passive: false });
      document.addEventListener(type, blockEvent, { capture: true, passive: false });
    });
  }

  function showLoader() {
    // Sabse pehle blocking on karo
    enableBlocking();

    document.body.innerHTML = "";

    var style = document.createElement("style");
    style.textContent =
      "html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#A26F4E!important;}" +
      "#reload-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#A26F4E;z-index:2147483647;pointer-events:all;}" +
      "#reload-loader .spinner{" +
        "width:clamp(80px,22vmin,180px);" +
        "height:clamp(80px,22vmin,180px);" +
        "border:clamp(7px,2vmin,14px) solid rgba(255,255,255,.3);" +
        "border-top-color:#fff;border-radius:50%;" +
        "animation:reload-spin .8s linear infinite;}" +
      "@keyframes reload-spin{to{transform:rotate(360deg)}}";
    document.head.appendChild(style);

    var wrap = document.createElement("div");
    wrap.id = "reload-loader";
    var spinner = document.createElement("div");
    spinner.className = "spinner";
    wrap.appendChild(spinner);
    document.body.appendChild(wrap);
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
      if (popunderLoaded()) {
        needRefresh = true;
        console.log("Popunder script loaded. Page will refresh when the user returns.");
      } else {
        console.log("Popunder script not loaded. Doing nothing.");
      }
    } else if (document.visibilityState === "visible" && needRefresh) {
      needRefresh = false;
      console.log("User returned. Showing loader and refreshing the page.");
      showLoader();
      setTimeout(function () {
        location.reload();
      }, 150);
    }
  });
})();
</script>
