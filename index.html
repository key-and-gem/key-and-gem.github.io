<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6efe6">
<title>Question of the Day</title>
<style>
:root {
  --bg: #f6efe6;
  --card: #A26F4E;
  --ink: #fff6ee;
  --muted: #f0dccb;
  --accent: #4a2c18;
  --accent-ink: #ffffff;
  --btn: #f3d9b1;
  --btn-ink: #3b2416;
  --gold: #c9a227;
  --ship: clamp(100px, 26vmin, 260px);
  --line: rgba(255, 255, 255, 0.35);
  --shade: rgba(40, 24, 14, 0.6);
  color-scheme: light;
}
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: transparent; }
button { touch-action: manipulation; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 16px 14px calc(var(--ship) * 0.75 + 28px);
}
main {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}
.feed {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sentinel { height: 1px; }
.end {
  margin: 20px 0 0;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: #7a5a44;
}

.card[hidden] { display: none; }
.ad-box {
  background: #fff6ee;
  color: #2e1c10;
  border-radius: 10px;
  padding: 8px;
  overflow: hidden;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 5px solid var(--gold);
  border-radius: 14px;
  padding: clamp(14px, 3.2vmin, 28px) clamp(14px, 3vmin, 24px);
  display: flex;
  flex-direction: column;
  width: 100%;
  box-shadow: 0 10px 30px rgba(46, 28, 16, 0.25);
}
.label {
  margin: 0 0 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
}
.question {
  margin: 0 0 clamp(10px, 2.4dvh, 24px);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(18px, 4.4vmin, 28px);
  line-height: 1.35;
  font-weight: 700;
}
.answer {
  margin: 0 0 clamp(10px, 2.4dvh, 24px);
  padding: clamp(10px, 2vmin, 18px) clamp(10px, 2vmin, 16px);
  border-radius: 10px;
  border: 1px solid var(--line);
  font-size: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.answer.locked {
  filter: blur(7px);
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
}
.answer.open {
  background: rgba(201, 162, 39, 0.12);
  border-color: var(--gold);
}
button {
  font: inherit;
  font-weight: 600;
  font-size: clamp(15px, 3.4vmin, 17px);
  padding: clamp(10px, 2.2vmin, 14px) 24px;
  border: 0;
  border-radius: 10px;
  background: var(--btn);
  color: var(--btn-ink);
  cursor: pointer;
}
button:disabled { opacity: 0.55; cursor: not-allowed; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.unlock { width: 100%; }
.overlay {
  position: fixed;
  inset: 0;
  background: var(--shade);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 12px;
  z-index: 10;
}
.overlay.show { display: flex; }
.pop {
  --pp: clamp(78px, 14dvh, 110px);
  --ps: min(150px, 38vw);
  position: relative;
  width: 100%;
  max-width: 360px;
  margin-top: calc(var(--pp) * 0.7);
}
.overlay.show .pop { animation: pop 0.22s ease-out; }
@keyframes pop {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
}
.pop-pirate {
  position: absolute;
  left: 50%;
  bottom: calc(100% - 20px);
  width: var(--pp);
  height: auto;
  transform: translateX(-50%);
  pointer-events: none;
}
.modal {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-areas: "ring" "actions";
  justify-items: center;
  row-gap: clamp(12px, 2.6dvh, 20px);
  overflow: hidden;
  background: var(--card);
  border-top: 5px solid var(--gold);
  border-radius: 20px;
  padding: clamp(22px, 4.4dvh, 30px) 22px calc(var(--ps) * 0.75 + 10px);
  text-align: center;
  box-shadow: 0 24px 60px rgba(46, 28, 16, 0.4);
}
.pop-ship {
  position: absolute;
  right: 0;
  bottom: 0;
  z-index: -1;
  width: var(--ps);
  height: auto;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to left, #000 60%, transparent);
  mask-image: linear-gradient(to left, #000 60%, transparent);
}
.close {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 2;
  width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 50%;
  font-size: 22px;
  line-height: 1;
  background: rgba(0, 0, 0, 0.28);
  color: #ffffff;
}
.ring {
  grid-area: ring;
  position: relative;
  --ring: min(168px, 24dvh, 56vw);
  width: var(--ring);
  height: var(--ring);
}
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; }
.ring .disc { fill: #f3e3d5; }
.ring .track { stroke: var(--line); stroke-width: 10; }
.ring .bar {
  stroke: var(--accent);
  stroke-width: 10;
  stroke-linecap: round;
  stroke-dasharray: 439.82;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.25s linear;
}
.count {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-bottom: calc(var(--ring) * 0.1);
  font-size: calc(var(--ring) * 0.34);
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.unit {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(50% + var(--ring) * 0.15);
  text-align: center;
  font-size: calc(var(--ring) * 0.09);
  font-weight: 600;
  color: #7a5a44;
}
.actions {
  grid-area: actions;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
#adBtn { width: 100%; box-shadow: 0 8px 18px rgba(46, 28, 16, 0.3); }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.3;
  background: #f3e8de;
  color: #7a4d31;
}
.chip:empty { display: none; }
.chip::before {
  content: "";
  flex: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}
.chip[data-state="running"] { background: #e2f4ee; color: #12684a; }
.chip[data-state="running"]::before { animation: beat 1.1s ease-in-out infinite; }
.chip[data-state="paused"] { background: #fff2cf; color: #7a5a00; }
@keyframes beat {
  50% { opacity: 0.25; }
}
@media (prefers-reduced-motion: reduce) {
  .overlay.show .pop, .chip::before { animation: none; }
}
@media (max-height: 480px) and (orientation: landscape) {
  .pop { max-width: 580px; }
  .modal {
    grid-template-columns: auto 1fr;
    grid-template-areas: "ring actions";
    column-gap: 30px;
    align-items: center;
    justify-items: start;
    padding: 20px 28px;
  }
  .pop-ship { display: none; }
  .ring { --ring: min(150px, 46dvh); }
  .actions { align-items: stretch; }
}

.ship {
  position: fixed;
  left: clamp(6px, 2vmin, 20px);
  bottom: clamp(6px, 2vmin, 20px);
  width: var(--ship);
  height: auto;
  z-index: 1;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 18%, #000 82%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0%, #000 18%, #000 82%, transparent 100%);
}
.pirate {
  position: fixed;
  left: 0;
  top: 100%;
  aspect-ratio: 1;
  z-index: 5;
  cursor: pointer;
  touch-action: manipulation;
}
.pirate img {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
@media (orientation: landscape) {
  body {
    padding: 10px calc(var(--ship) + 18px);
  }
}
</style>
</head>
<body>
<main>
  <div class="feed" id="feed"></div>
  <div class="sentinel" id="sentinel"></div>
  <p class="end" id="end" hidden>You're all caught up</p>
</main>

<div class="overlay" id="overlay">
  <div class="pop">
    <img class="pop-pirate" id="popPirate" alt="">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Watch ad">
      <button class="close" id="closeBtn" type="button" aria-label="Close">&times;</button>
      <div class="ring">
        <svg viewBox="0 0 160 160" aria-hidden="true">
          <circle class="disc" cx="80" cy="80" r="64"></circle>
          <circle class="track" cx="80" cy="80" r="70"></circle>
          <circle class="bar" id="bar" cx="80" cy="80" r="70"></circle>
        </svg>
        <div class="count" id="count"></div>
        <div class="unit">seconds</div>
      </div>
      <div class="actions">
        <button id="adBtn" type="button"></button>
        <div class="chip" id="status" data-state="ready"></div>
      </div>
      <img class="pop-ship" id="popShip" alt="">
    </div>
  </div>
</div>

    var box = make("div", "ad-box");
    var holder = make("div");
    var tag = document.createElement("script");
    holder.id = NATIVE_AD.containerId;
    tag.async = true;
    tag.setAttribute("data-cfasync", "false");
    tag.src = NATIVE_AD.src;
    box.appendChild(holder);
    card.appendChild(make("p", "label", "Sponsored"));
    card.appendChild(box);
    card.appendChild(tag);
    card.hidden = true;
    if ("MutationObserver" in window) {
      var watcher = new MutationObserver(function () {
        if (box.textContent.trim() !== "" || box.querySelector("img, iframe, a")) {
          card.hidden = false;
          watcher.disconnect();
        }
      });
      watcher.observe(box, { childList: true, subtree: true });
    } else {
      card.hidden = false;
    }
    return card;
  }

  function renderBatch() {
    var stop = Math.min(shown + BATCH, list.length);
    var frag = document.createDocumentFragment();
    for (var i = shown; i < stop; i++) {
      frag.appendChild(buildCard(list[i]));
      if (i === 0) {
        frag.appendChild(buildAdCard());
      }
    }
    feedEl.appendChild(frag);
    shown = stop;
    if (shown >= list.length) {
      if (observer) {
        observer.disconnect();
      }
      sentinelEl.style.display = "none";
      endEl.hidden = false;
    }
  }

  function loadMore() {
    if (shown >= list.length) {
      return;
    }
    renderBatch();
    if (observer && shown < list.length) {
      observer.unobserve(sentinelEl);
      observer.observe(sentinelEl);
    }
  }

  function setStatus(state, text) {
    statusEl.dataset.state = state;
    statusEl.textContent = text;
  }

  function isAway() {
    return document.hidden || !document.hasFocus();
  }

  function secsLeft() {
    return Math.max(0, Math.ceil((TOTAL_MS - cur.elapsed) / 1000));
  }

  function idleLabel() {
    return cur.elapsed > 0 ? "Continue Watching Ad" : "Watch Ad";
  }

  function render() {
    if (!cur) {
      return;
    }
    countEl.textContent = secsLeft();
    barEl.style.strokeDashoffset = String(CIRC * (cur.elapsed / TOTAL_MS));
  }

  function stopTimer() {
    clearInterval(timerId);
    timerId = null;
  }

  function showIdle() {
    active = false;
    adBtn.disabled = false;
    adBtn.textContent = idleLabel();
    if (cur.elapsed > 0) {
      setStatus("paused", "Almost there. " + secsLeft() + "s left.");
    } else {
      setStatus("ready", "");
    }
    render();
  }

  function openModal(item) {
    cur = item;
    active = false;
    stopTimer();
    overlay.classList.add("show");
    showIdle();
    adBtn.focus();
  }

  function closeModal() {
    overlay.classList.remove("show");
    active = false;
    stopTimer();
  }

  function finish() {
    cur.finished = true;
    cur.elapsed = TOTAL_MS;
    active = false;
    stopTimer();
    render();
    cur.answerEl.textContent = cur.answer;
    cur.answerEl.classList.remove("locked");
    cur.answerEl.classList.add("open");
    cur.btn.style.display = "none";
    overlay.classList.remove("show");
  }

  function tick() {
    if (!cur || cur.finished) {
      return;
    }
    var now = performance.now();
    var delta = now - lastTick;
    lastTick = now;
    if (active && isAway()) {
      cur.elapsed += delta;
      if (cur.elapsed >= TOTAL_MS) {
        finish();
        return;
      }
      setStatus("running", "Ad timer is running");
    }
    render();
  }

  function startAd() {
    window.open(AD.url, "_blank");
    active = true;
    clickedAt = performance.now();
    lastTick = clickedAt;
    adBtn.disabled = true;
    adBtn.textContent = "Ad timer running";
    setStatus("running", "Ad opened in a new tab. Stay there until it ends.");
    render();
    stopTimer();
    timerId = setInterval(tick, 250);
  }

  function onReturn() {
    if (!active || !cur || cur.finished) {
      return;
    }
    if (performance.now() - clickedAt < 600) {
      return;
    }
    lastTick = performance.now();
    showIdle();
  }

  document.getElementById("popPirate").src = document.querySelector("#pirate img").src;
  document.getElementById("popShip").src = document.getElementById("ship").src;

  renderBatch();

  if ("IntersectionObserver" in window) {
    observer = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) {
        loadMore();
      }
    }, { rootMargin: "0px 0px 120px 0px" });
    if (shown < list.length) {
      observer.observe(sentinelEl);
    }
  } else {
    window.addEventListener("scroll", function () {
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 200) {
        loadMore();
      }
    });
  }

  document.addEventListener("selectstart", function (e) {
    e.preventDefault();
  });
  document.addEventListener("mousedown", function (e) {
    if (e.detail > 1) {
      e.preventDefault();
    }
  });

  closeBtn.addEventListener("click", closeModal);
  adBtn.addEventListener("click", startAd);
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) {
      closeModal();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay.classList.contains("show")) {
      closeModal();
    }
  });
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      onReturn();
    }
  });
  window.addEventListener("focus", onReturn);
})();
</script>

<script>
(function () {
  var base = document.getElementById("pirate");
  var spots = ["top", "left", "bottom", "right"];
  var moves = {
    top: ["left", "right"],
    left: ["top", "bottom"],
    bottom: ["left", "right"],
    right: ["top", "bottom"]
  };
  var taken = {};
  var pirates = [];
  var size = 0;
  var peek = 0;
  var SLIDE = "left .3s ease-out, top .3s ease-out";

  function measure() {
    size = Math.round(Math.max(72, Math.min(170, Math.min(window.innerWidth, window.innerHeight) * 0.2)));
    peek = Math.round(size * 0.65);
    pirates.forEach(function (p) {
      p.el.style.width = size + "px";
      p.el.style.height = size + "px";
    });
  }

  function place(p, side, shown) {
    var w = window.innerWidth;
    var h = window.innerHeight;
    var out = shown ? 0 : peek;
    var left = 0;
    var top = 0;
    var rot = 0;
    if (side === "bottom") {
      left = w / 2 - size / 2;
      top = h - peek + out;
    } else if (side === "top") {
      left = w / 2 - size / 2;
      top = -(size - peek) - out;
      rot = 180;
    } else if (side === "left") {
      left = -(size - peek) - out;
      top = h / 2 - size / 2;
      rot = 90;
    } else {
      left = w - peek + out;
      top = h / 2 - size / 2;
      rot = -90;
    }
    p.el.style.left = left + "px";
    p.el.style.top = top + "px";
    p.el.style.transform = "rotate(" + rot + "deg)";
  }

  function makePirate(el, pick) {
    var p = {
      el: el,
      pick: pick,
      side: null,
      last: spots[Math.floor(Math.random() * spots.length)],
      leaving: false,
      timer: null
    };
    pirates.push(p);
    return p;
  }

  function schedule(p, delay) {
    clearTimeout(p.timer);
    p.timer = setTimeout(function () {
      appear(p);
    }, delay);
  }

  function appear(p) {
    measure();
    var options = p.pick(p).filter(function (s) {
      return !taken[s];
    });
    if (options.length === 0) {
      schedule(p, 700);
      return;
    }
    var side = options[Math.floor(Math.random() * options.length)];
    taken[side] = true;
    p.side = side;
    p.last = side;
    p.el.style.transition = "none";
    place(p, side, false);
    p.el.offsetWidth;
    p.el.style.transition = SLIDE;
    place(p, side, true);
    p.timer = setTimeout(function () {
      leave(p, 0);
    }, 5000);
  }

  function leave(p, delay) {
    clearTimeout(p.timer);
    if (!p.side || p.leaving) {
      return;
    }
    var side = p.side;
    p.leaving = true;
    p.el.style.transition = SLIDE;
    place(p, side, false);
    p.timer = setTimeout(function () {
      taken[side] = false;
      p.side = null;
      p.leaving = false;
      schedule(p, delay);
    }, 400);
  }

  var guided = makePirate(base, function (p) {
    return moves[p.last];
  });
  var wild = makePirate(base.cloneNode(true), function (p) {
    return spots.filter(function (s) {
      return s !== p.last;
    });
  });
  wild.el.removeAttribute("id");
  document.body.appendChild(wild.el);

  pirates.forEach(function (p) {
    p.el.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      leave(p, 0);
    });
  });

  window.addEventListener("resize", function () {
    taken = {};
    measure();
    pirates.forEach(function (p) {
      clearTimeout(p.timer);
      p.side = null;
      p.leaving = false;
      p.el.style.transition = "none";
      p.el.style.top = "100%";
      schedule(p, 1500);
    });
  });

  measure();
  schedule(guided, 1500);
  schedule(wild, 3500);
})();
</script>
</body>
</html>
