<style>
:root{--bg:#1b3a8a;--panel:#2b4fb8;--dark:#0b1f5c;--hi:#5d8bff;--lo:#1a3585;--cyan:#7fe9ff;--green:#3aa655;--gold:#ffd23f;--text:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P','Courier New',monospace;color:var(--text);background-color:var(--bg);image-rendering:pixelated;overflow-x:hidden;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floaters i{position:absolute;bottom:-40px;width:var(--s);height:var(--s);background:var(--c);box-shadow:inset calc(var(--s)/5) calc(var(--s)/5) 0 rgba(255,255,255,.35),inset calc(var(--s)/-5) calc(var(--s)/-5) 0 rgba(0,0,0,.3);opacity:.5;animation:rise var(--d) linear infinite;animation-delay:var(--w)}
@keyframes rise{to{transform:translateY(-115vh) rotate(180deg)}}
.panel{position:relative;z-index:1;width:min(94vw,580px);padding:22px;text-align:center;background:var(--panel);border:6px solid var(--dark);box-shadow:inset 6px 6px 0 var(--hi),inset -6px -6px 0 var(--lo),8px 8px 0 rgba(0,0,0,.45)}
h1{font-size:clamp(16px,4.4vw,24px);margin:0 0 6px;text-shadow:3px 3px 0 var(--dark);line-height:1.5}
h1{display:flex;align-items:center;justify-content:center;gap:12px}
.avatar{width:54px;height:54px;flex:none;border-radius:50%;object-fit:cover;border:3px solid var(--dark);background:var(--dark);image-rendering:auto;box-shadow:3px 3px 0 var(--dark)}
.sub{font-size:9px;color:var(--cyan);margin:0 0 16px;line-height:1.8}
.xp{height:14px;background:var(--dark);border:3px solid #000;margin:0 0 6px;position:relative}
.xp b{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#7fff3a 0 8px,#4fd01c 8px 16px);transition:width .5s steps(8)}
.stats{display:flex;justify-content:center;font-size:clamp(11px,3vw,14px);margin-top:16px;margin-bottom:14px;color:#cfe0ff}
.reel{position:relative;height:170px;margin-bottom:18px;background:var(--dark);border:4px solid #000;box-shadow:inset 4px 4px 0 #000;overflow:hidden}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:42px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(var(--dark),transparent)}
.reel::after{bottom:0;background:linear-gradient(transparent,var(--dark))}
.marker{position:absolute;top:50%;left:0;right:0;height:3px;background:none;z-index:3;transform:translateY(-1px)}
.marker::before,.marker::after{content:"▶";position:absolute;top:-8px;font-size:12px;color:var(--gold)}
.marker::before{left:4px}.marker::after{right:4px;transform:scaleX(-1)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.row{height:56px;display:flex;align-items:center;justify-content:center;padding:0 28px;font-size:clamp(9px,2.3vw,11px);line-height:1.6;color:var(--cyan);opacity:.55;overflow:hidden}
.row.win{color:#fff;opacity:1}
.result{min-height:112px;display:none;align-items:center;justify-content:center;padding:16px;margin-bottom:18px;background:var(--dark);border:4px solid var(--gold);box-shadow:inset 4px 4px 0 #000;font-size:clamp(11px,2.8vw,14px);line-height:1.9;word-break:break-word;animation:pop .45s steps(5)}
.result.show{display:flex}
@keyframes pop{0%{transform:scale(.8) rotate(-1deg)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.badge{display:inline-block;font-size:11px;background:var(--gold);color:#000;padding:6px 9px;margin-bottom:10px;border:2px solid #000}
.btns{display:flex;gap:10px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
button{font-family:inherit;font-size:12px;color:#fff;cursor:pointer;padding:14px 18px;background:var(--green);border:4px solid var(--dark);box-shadow:inset 4px 4px 0 #6fe08a,inset -4px -4px 0 #1f6b34;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
button:hover{filter:brightness(1.12)}
button:active{transform:translate(3px,3px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{filter:grayscale(.7);cursor:not-allowed}
#spinBtn{font-size:16px;padding:16px 36px}
#spinBtn.ready,#copyBtn.ready{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.alt{background:#4a6fd8;box-shadow:inset 4px 4px 0 #8aa8ff,inset -4px -4px 0 #2a47a0}
#goBack{background:#ff5a1f;box-shadow:inset 4px 4px 0 #ffa070,inset -4px -4px 0 #a82f00}
.hidden{display:none!important}
.fontload{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
body.fl .panel,body.fl .floaters{visibility:hidden}
.pend{visibility:hidden}
.spin{width:56px;height:56px;border:8px solid rgba(255,255,255,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s steps(8) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.copywrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.copylabel{font-size:9px;line-height:1.4;color:var(--gold);text-shadow:2px 2px 0 var(--dark)}
#answer{display:block;width:100%;min-height:110px;margin:0 0 14px;padding:12px;resize:vertical;font-family:inherit;font-size:11px;line-height:1.8;color:#fff;background:var(--dark);border:4px solid #000;box-shadow:inset 4px 4px 0 #000;outline:none}
#answer::placeholder{color:#7f95d6}
#answer:focus{border-color:var(--gold)}
.hist{margin-top:16px;font-size:8px;line-height:1.9;color:#b9cdff;text-align:left}
.hist summary{cursor:pointer;text-align:center}
.hist ol{margin:8px 0 0;padding-left:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;border:3px solid var(--gold);padding:10px 14px;font-size:9px;z-index:9;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.mute{position:absolute;top:8px;right:8px;padding:6px 8px;font-size:10px}
@media (prefers-reduced-motion:reduce){.floaters i,#spinBtn.ready,#copyBtn.ready,.result{animation:none}}
</style>

<script>
// ================== YAHAN APNE QUESTIONS DAALO (one per line) ==================
const QUESTIONS = `
What is the first thing you would build in Minecraft?
Which mob scares you the most and why?
If you could have one diamond tool, which would it be?
What is your best survival tip?
Would you rather fight the Ender Dragon or the Wither?
What is your favorite biome?
Describe your dream base in one sentence.
What is the funniest way you have died in the game?
`;
// ================== YAHAN APNA REDIRECT URL DAALO ==================
const REDIRECT_URL = "https://www.reddit.com/";
// ===================================================================

const questions = QUESTIONS.split("\n").map(q=>q.trim()).filter(Boolean);
const $ = id => document.getElementById(id);
const answer=$("answer");
const strip=$("strip"), reel=$("reel"), result=$("result"), spinBtn=$("spinBtn"), goBack=$("goBack"), copyBtn=$("copyBtn");
const ROW=56, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let spins=0, busy=false, muted=false, seen=[], current="", wiped=false, leaving=false;
const BADGES=["Challenge"];

// ---- spinner stays until the pixel font has REALLY loaded (retries if it fails) ----
(function(){
  let shown=false;
  const FONT='12px "Press Start 2P"';
  const reveal=()=>{if(shown)return;shown=true;document.body.classList.remove("fl");const f=document.getElementById("fontload");if(f)f.remove()};
  const retry=()=>{
    if(shown)return;
    setTimeout(()=>{ // fetch the font stylesheet again
      if(shown)return;
      const src=document.querySelector('link[href*="fonts.googleapis.com"]'),l=document.createElement("link");
      l.rel="stylesheet";l.href=src?src.href:"https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap";
      l.onload=check;l.onerror=retry;document.head.appendChild(l);
    },2000);
  };
  const check=()=>{
    if(!(document.fonts&&document.fonts.load)){reveal();return} // very old browser: cannot wait
    document.fonts.load(FONT).then(f=>f.length?reveal():retry(),retry); // 0 faces = stylesheet failed
  };
  if(window.__css)check();else document.addEventListener("csslink",check,{once:true});
})();

// pixel texture bg
(function(){const c=document.createElement("canvas");c.width=c.height=16;const x=c.getContext("2d");
const s=["#1b3a8a","#1f43a0","#17327a","#2450b8","#1a3c94"];
for(let i=0;i<16;i++)for(let j=0;j<16;j++){x.fillStyle=s[Math.random()*5|0];x.fillRect(i,j,1,1)}
document.body.style.backgroundImage=`url(${c.toDataURL()})`;document.body.style.backgroundSize="64px 64px"})();

// floating blocks
(function(){const cols=["#3aa655","#8b5a2b","#9aa4b2","#4cd0e8","#ffd23f","#e8453c"];const f=$("floaters");
for(let i=0;i<16;i++){const e=document.createElement("i");
e.style.cssText=`left:${Math.random()*100}%;--s:${14+Math.random()*22|0}px;--c:${cols[i%cols.length]};--d:${12+Math.random()*14}s;--w:-${Math.random()*20}s`;f.appendChild(e)}})();

// sound
let ac;
function beep(f,d=.06,t="square",v=.05){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;
o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,"square",.06),i*110))}

// confetti (pixel squares)
const cv=$("fx"),cx=cv.getContext("2d");let parts=[];
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function burst(){if(reduce)return;const r=reel.getBoundingClientRect(),cols=["#7fff3a","#ffd23f","#4cd0e8","#ff5a1f","#fff"];
for(let i=0;i<70;i++)parts.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:5+Math.random()*7|0,c:cols[i%5],l:70+Math.random()*30});
if(parts.length===70)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);
parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;cx.fillStyle=p.c;cx.fillRect(p.x|0,p.y|0,p.s,p.s)});
if(parts.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height)}

// pick: avoid repeats until all seen
function pick(){let pool=questions.filter(q=>!seen.includes(q));if(!pool.length){seen=[];pool=questions.slice()}
const q=pool[Math.random()*pool.length|0];seen.push(q);return q}

function rowEl(t){const d=document.createElement("div");d.className="row";d.textContent=t;return d}

// endless wheel: question for each absolute row number n
const seq=new Map();
function qAt(n){
  if(!seq.has(n)){
    let q,tries=0;
    do{q=questions[Math.random()*questions.length|0];tries++}
    while(questions.length>1&&tries<10&&(q===seq.get(n-1)||q===seq.get(n+1)));
    seq.set(n,q);
  }
  return seq.get(n);
}
const VIS=7, SPEED=.55; // SPEED = px per ms
let pos=0, base=null, lastIdx=null, stopAnim=null, lastT=performance.now();
const els=[];
for(let i=0;i<VIS;i++){const e=rowEl("");strip.appendChild(e);els.push(e)}

function render(){
  const center=reel.clientHeight/2-ROW/2;
  const nb=Math.floor(pos/ROW)-2;
  if(nb!==base){base=nb;els.forEach((e,i)=>e.textContent=qAt(base+i));seq.delete(base-3)}
  strip.style.transform=`translateY(${center+base*ROW-pos}px)`;
  const idx=Math.round(pos/ROW);
  els.forEach((e,i)=>e.classList.toggle("win",base+i===idx));
  if(idx!==lastIdx){lastIdx=idx;beep(300+(((idx%6)+6)%6)*40,.03,"square",.03)}
}

function tick(now){
  if(wiped)return;
  const dt=Math.min(50,now-lastT);lastT=now;
  if(stopAnim){
    const p=Math.min(1,(now-stopAnim.t0)/stopAnim.dur), e=1-Math.pow(1-p,3);
    pos=stopAnim.from+(stopAnim.to-stopAnim.from)*e;
    render();
    if(p>=1){const q=stopAnim.q;stopAnim=null;done(q);return}
  }else{pos+=SPEED*dt;render()}
  requestAnimationFrame(tick);
}

// STOP: slow the wheel down and land on a question
function stopWheel(){
  if(stopAnim)return;
  spinBtn.disabled=true;spinBtn.classList.remove("ready");
  const q=pick(), n=Math.ceil(pos/ROW)+6;
  seq.set(n,q);
  const from=pos, to=n*ROW;
  stopAnim={from,to,t0:performance.now(),dur:reduce?300:3*(to-from)/SPEED,q};
}

function done(q){
  current=q;spins++;busy=false;spinBtn.disabled=false;
  $("badge").textContent=BADGES[Math.random()*BADGES.length|0];
  $("resultText").textContent=q;result.classList.add("show");
  reel.classList.add("hidden");
  spinBtn.classList.add("hidden");answer.value="";goBack.disabled=true;answer.classList.remove("hidden");
  $("copyWrap").classList.remove("hidden");goBack.classList.remove("hidden");
  fanfare();burst();
  $("hist").hidden=false;const li=document.createElement("li");li.textContent=q;$("histList").prepend(li);
}

spinBtn.onclick=stopWheel;
answer.addEventListener("input",()=>{if(!leaving)goBack.disabled=!answer.value.trim()});

async function copyAnswer(){
  const txt=answer.value.trim();
  const out=(txt?txt+"\n":"")+"[Rolled - "+current+"]";
  try{await navigator.clipboard.writeText(out);return true}
  catch(e){const ta=document.createElement("textarea");ta.value=out;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}
}

copyBtn.onclick=async()=>{
  const t=$("toast");
  if(!answer.value.trim()){t.textContent="Write your answer first!";answer.focus();t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1400);return}
  const ok=await copyAnswer();
  if(!ok){t.textContent="Copy failed, try again!";t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1400);return}
  copyBtn.classList.remove("ready");
  t.textContent="Copied!";t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1200);beep(880,.08)};

// Go Back: auto-copy first, then "Redirecting...", then redirect
goBack.onclick=async()=>{
  leaving=true;
  goBack.disabled=true;
  goBack.textContent="Copying...";
  await copyAnswer();
  goBack.textContent="Redirecting...";
  setTimeout(()=>{window.location.href=REDIRECT_URL},800)};

// ---- popunder: STOP gate + tab-leave guard ----
function showStop(){if(questions.length&&!current)spinBtn.classList.remove("pend")}
function wipePage(){
  wiped=true;
  document.body.innerHTML='<div class="spin" role="status" aria-label="Loading"></div>'; // only the background + spinner remain
}
let needRefresh=false;
function armTabGuard(){ // runs only if the popunder script loaded in this visit
  const check=()=>{
    if(leaving)return;
    if(document.hidden){if(!wiped){needRefresh=true;wipePage()}}
    else if(needRefresh){location.reload()}
  };
  document.addEventListener("visibilitychange",check);
  check(); // user was already on another tab when the ad finished loading
}
function whenAd(flag,evt,fn){if(window.adState&&window.adState[flag])fn();else document.addEventListener(evt,fn,{once:true})}
whenAd("ready","adready",showStop);
whenAd("loaded","adloaded",armTabGuard);

// start the wheel spinning right away
if(!questions.length){result.classList.add("show");$("resultText").textContent="No questions found!";spinBtn.classList.add("hidden")}
else{render();lastT=performance.now();requestAnimationFrame(tick)}
</script>
</body>
