<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0b0620;
    --bg2: #1b0b4a;
    --neon-cyan: #22e6ff;
    --neon-pink: #ff2e9a;
    --neon-green: #3dff8b;
    --neon-red: #ff4d4d;
    --text: #f2f0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Orbitron', system-ui, sans-serif;
    color: var(--text);
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    position: relative;
  }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  main { position: relative; z-index: 1; width: 100%; max-width: 900px; text-align: center; }

  #joystick {
    display: block;
    width: clamp(120px, 30vw, 220px);
    height: auto;
    margin: clamp(20px, 5vh, 44px) auto 0;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,.6));
  }


  /* joystick ki stick left-right hilti rahe */
  #joystick { overflow: visible; }
  #joystick .stick {
    transform-box: view-box;
    transform-origin: 64px 98px;          /* stick ka pivot (dome ke neeche) */
    animation: stickSwing 1s ease-in-out infinite alternate;
  }
  @keyframes stickSwing {
    from { transform: rotate(-20deg); }   /* left */
    to   { transform: rotate(20deg); }    /* right */
  }
  @media (prefers-reduced-motion: reduce) { #joystick .stick { animation: none; } }

  #title {
    font-size: clamp(1.9rem, 7vw, 4rem);
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.15;
    text-align: center;
    color: #fff;
    max-width: 92%;
    margin: 0 auto clamp(28px, 6vh, 56px);
    text-wrap: balance;        /* lamba title ho to line barabar tootegi */
    overflow-wrap: anywhere;   /* bahut lamba word bhi bahar nahi jayega */
  }

  .buttons {
    display: flex;
    gap: clamp(14px, 4vw, 40px);
    justify-content: center;
    align-items: stretch;
  }
  .buttons { padding-bottom: 22px; }
  .btn {
    --edge: #141a28;          /* button ki moti side wali body */
    flex: 1 1 0;
    max-width: 340px;
    min-height: clamp(260px, 42vh, 380px); /* lambe buttons */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 12px;
    font-family: inherit;
    color: var(--text);
    position: relative;
    cursor: pointer;
    border: 2px solid #0c101a;
    border-radius: 22px;
    /* upar se halki roshni wala plastic jaisa face */
    background:
      linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(180deg, #5b6785 0%, #3a4560 55%, #2e3850 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.35),     /* upar ka chamakta kinara */
      inset 0 -6px 10px rgba(0,0,0,.35),       /* neeche ka andhera */
      0 12px 0 var(--edge),                     /* button ki height (3D side) */
      0 20px 28px rgba(0,0,0,.6);              /* zameen par parchhai */
    transform: translateY(0);
    transition: transform .08s ease-out, box-shadow .08s ease-out, filter .15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active, .btn.pressed {
    transform: translateY(10px);               /* button neeche dab gaya */
    filter: brightness(.95);
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,.45),
      inset 0 -2px 0 rgba(255,255,255,.08),
      0 2px 0 var(--edge),
      0 6px 10px rgba(0,0,0,.6);
  }
  .btn:focus-visible { outline: 3px solid var(--neon-cyan); outline-offset: 6px; }
  .btn img { width: clamp(70px, 18vw, 130px); height: auto; filter: drop-shadow(0 4px 3px rgba(0,0,0,.45)); pointer-events: none; }
  .btn .label { font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 800; letter-spacing: .06em; text-shadow: 0 2px 2px rgba(0,0,0,.6); }
  /* "Recommended" / "Warning": size original wala, bas font bold + bright white taaki door se saaf dikhe */
  .btn .sub {
    font-size: clamp(.7rem, 2.4vw, 1rem);
    font-weight: 800;
    letter-spacing: .08em;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }

  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

  /* ====== Spin popup ====== */
  .modal {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,.78);
  }
  .modal.open { display: flex; }
  .modal-box {
    width: 100%; max-width: 520px;
    padding: 28px 20px 24px;
    text-align: center;
    background: linear-gradient(180deg, #1a1440 0%, #0b0620 100%);
    border: 2px solid var(--neon-cyan);
    border-radius: 22px;
  }
  .modal-title { font-size: clamp(1.3rem, 5vw, 2rem); font-weight: 800; letter-spacing: .06em; margin-bottom: 18px; }
  .reel {
    position: relative;
    height: 240px;                      /* JS screen ke hisaab se set karta hai (3 rows) */
    overflow: hidden;
    border-radius: 14px;
    border: 2px solid #2a3350;
    background: #000;
  }
  /* upar aur neeche wali rows ka text dull (beech wali normal rehti hai) */
  .reel::before, .reel::after {
    content: ""; position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none;
    height: 33.333%;
    background: rgba(0,0,0,.55);        /* dull kam/zyada karna ho to .55 badlo */
  }
  .reel::before { top: 0; }
  .reel::after { bottom: 0; }
  /* beech wali row (jo aaya) ke left mein ">" aur right mein "<" */
  .reel-focus {
    position: absolute; left: 0; right: 0; top: 33.333%; height: 33.333%; z-index: 2; pointer-events: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px;
    font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 800; color: var(--neon-cyan);
  }
  .reel-focus::before { content: ">"; }
  .reel-focus::after  { content: "<"; }
  .reel-strip { will-change: transform; }
  .reel-item {
    display: flex; align-items: center; justify-content: center;
    padding: 0 44px;                    /* arrows ke liye jagah */
    font-size: clamp(1rem, 3.8vw, 1.5rem);
    font-weight: 600; line-height: 1.25;
    text-wrap: balance; overflow-wrap: anywhere;
  }
  .spin-btn {
    width: 100%; margin-top: 22px; padding: 14px;
    font-family: inherit; font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 800; letter-spacing: .06em;
    color: #cfd6ea; background: #3a4560;
    border: none; border-radius: 14px;
    cursor: default;
  }
  .spin-btn { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .spin-btn.ready { color: #fff; background: #ff4500; cursor: pointer; }
  .spin-btn img { height: 1.6em; width: auto; display: block; }
</style>
</head>

<div class="modal" id="spinModal">
  <div class="modal-box">
    <div class="modal-title">You rolled...</div>
    <div class="reel" id="reel"><div class="reel-strip" id="reelStrip"></div><div class="reel-focus"></div></div>
    <button class="spin-btn" id="spinBtn" disabled>Spinning...</button>
  </div>
</div>

<script>
 // ====== Stars background ======
  (function () {
    const cv = document.getElementById('stars'), c = cv.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W, H, stars = [];
    function init() {
      const dpr = window.devicePixelRatio || 1;
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(W * H / 5000);          // stars ki ginti (kam/zyada ke liye 5000 badlo)
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,               // size
        v: Math.random() * 8 + 3,                   // speed (px/sec) - bahut slow
        a: Math.random() * 0.6 + 0.3,               // brightness
        t: Math.random() * 6.28                     // halka twinkle
      }));
    }
    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.1); last = now;
      c.clearRect(0, 0, W, H);
      for (const s of stars) {
        if (!reduce) { s.x += s.v * dt; s.t += dt; if (s.x > W + 2) { s.x = -2; s.y = Math.random() * H; } }
        c.globalAlpha = s.a * (0.75 + 0.25 * Math.sin(s.t));
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.283); c.fill();
      }
      requestAnimationFrame(frame);
    }
    addEventListener('resize', init);
    init(); requestAnimationFrame(frame);
  })();

  // ====== Yahan se title change karo ======
  const GAME_TITLE = "Choose One";
  // ========================================

  const titleEl = document.getElementById('title');
  titleEl.textContent = GAME_TITLE;
  document.title = GAME_TITLE;


  // physical button jaisa "click" awaaz + vibration
  let ctx;
  function clickSound() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(180, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.06);
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      o.connect(g).connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.09);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(15);
  }
  document.querySelectorAll('.btn').forEach(b => {
    b.addEventListener('pointerdown', clickSound);
    b.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { b.classList.add('pressed'); clickSound(); } });
    b.addEventListener('keyup', () => b.classList.remove('pressed'));
  });

  // ====== Yahan apne sentences likho (ek line mein ek sentence) ======
  const EASY_SENTENCES = [
    "Easy sentence 1",
    "Easy sentence 2",
    "Easy sentence 3",
    "Easy sentence 4",
    "Easy sentence 5",
  ];
  const HARD_SENTENCES = [
    "Hard sentence 1",
    "Hard sentence 2",
    "Hard sentence 3",
    "Hard sentence 4",
    "Hard sentence 5",
  ];
  // ===================================================================

  // "Go back to" ke baad jo image/SVG dikhani ho uska path ya data URI yahan daalo ("" = kuch nahi)
  const GO_BACK_IMAGE = "";

  const modal = document.getElementById('spinModal');
  const reel = document.getElementById('reel');
  const strip = document.getElementById('reelStrip');
  const spinBtn = document.getElementById('spinBtn');
  let currentMode = null, currentResult = null;

  function openSpin(mode, list) {
    currentMode = mode;
    currentResult = list[Math.floor(Math.random() * list.length)];

    spinBtn.textContent = 'Spinning...';
    spinBtn.disabled = true;
    spinBtn.classList.remove('ready');
    modal.classList.add('open');

    // reel 3 rows dikhata hai: pehle wala, jo aaya (beech mein highlight), baad wala
    const H = Math.max(64, Math.min(84, Math.round(innerHeight * 0.12)));   // ek row ki height
    reel.style.height = (H * 3 + 4) + 'px';                                  // +4 = border
    const pick = (not) => {
      if (list.length < 2) return list[0];
      let t; do { t = list[Math.floor(Math.random() * list.length)]; } while (t === not);
      return t;
    };
    const COUNT = 30;
    const items = [];
    for (let i = 0; i < COUNT; i++) items.push(list[Math.floor(Math.random() * list.length)]);
    items.push(pick(currentResult));   // result se pehle wala
    items.push(currentResult);         // result (beech mein rukega)
    items.push(pick(currentResult));   // result ke baad wala
    strip.innerHTML = '';
    items.forEach(t => {
      const d = document.createElement('div');
      d.className = 'reel-item';
      d.style.height = H + 'px';
      d.textContent = t;
      strip.appendChild(d);
    });

    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dur = reduce ? 600 : 4000;     // spin kitni der chalega (ms)
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    void strip.offsetHeight;             // reflow
    strip.style.transition = 'transform ' + dur + 'ms cubic-bezier(.12,.6,.1,1)';
    strip.style.transform = 'translateY(' + (-COUNT * H) + 'px)';

    setTimeout(() => {
      // button: "Go back to" + (agar GO_BACK_IMAGE di ho to wo image)
      spinBtn.textContent = '';
      const t = document.createElement('span');
      t.textContent = 'Go back to Reddit';
      spinBtn.appendChild(t);
      if (GO_BACK_IMAGE) {
        const im = document.createElement('img');
        im.src = GO_BACK_IMAGE;
        im.alt = '';
        spinBtn.appendChild(im);
      }
      spinBtn.disabled = false;
      spinBtn.classList.add('ready');
    }, dur + 50);
  }

  spinBtn.addEventListener('click', () => {
    if (spinBtn.disabled) return;
    // baad mein yahan is button ka kaam likhenge
    console.log('Go back clicked', currentMode, currentResult);
  });

  document.getElementById('easyBtn').addEventListener('click', () => openSpin('easy', EASY_SENTENCES));
  document.getElementById('hardBtn').addEventListener('click', () => openSpin('hard', HARD_SENTENCES));
</script>
</body>
</html>
