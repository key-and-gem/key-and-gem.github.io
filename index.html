<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0b0620;
    --bg2: #1b0b4a;
    --neon-cyan: #22e6ff;
    --neon-pink: #ff2e9a;
    --neon-green: #3dff8b;
    --neon-red: #ff4d4d;
    --text: #f2f0ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Orbitron', system-ui, sans-serif;
    color: var(--text);
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    position: relative;
  }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  main { position: relative; z-index: 1; width: 100%; max-width: 900px; text-align: center; }

  #joystick {
    display: block;
    width: clamp(120px, 30vw, 220px);
    height: auto;
    margin: clamp(20px, 5vh, 44px) auto 0;
    filter: drop-shadow(0 8px 6px rgba(0,0,0,.6));
  }


  /* joystick ki stick left-right hilti rahe */
  #joystick { overflow: visible; }
  #joystick .stick {
    transform-box: view-box;
    transform-origin: 64px 98px;          /* stick ka pivot (dome ke neeche) */
    animation: stickSwing 1s ease-in-out infinite alternate;
  }
  @keyframes stickSwing {
    from { transform: rotate(-20deg); }   /* left */
    to   { transform: rotate(20deg); }    /* right */
  }
  @media (prefers-reduced-motion: reduce) { #joystick .stick { animation: none; } }

  #title {
    font-size: clamp(1.9rem, 7vw, 4rem);
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.15;
    text-align: center;
    color: #fff;
    max-width: 92%;
    margin: 0 auto clamp(28px, 6vh, 56px);
    text-wrap: balance;        /* lamba title ho to line barabar tootegi */
    overflow-wrap: anywhere;   /* bahut lamba word bhi bahar nahi jayega */
  }

  .buttons {
    display: flex;
    gap: clamp(14px, 4vw, 40px);
    justify-content: center;
    align-items: stretch;
  }
  .buttons { padding-bottom: 22px; }
  .btn {
    --edge: #141a28;          /* button ki moti side wali body */
    flex: 1 1 0;
    max-width: 340px;
    min-height: clamp(260px, 42vh, 380px); /* lambe buttons */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 12px;
    font-family: inherit;
    color: var(--text);
    position: relative;
    cursor: pointer;
    border: 2px solid #0c101a;
    border-radius: 22px;
    /* upar se halki roshni wala plastic jaisa face */
    background:
      linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(180deg, #5b6785 0%, #3a4560 55%, #2e3850 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.35),     /* upar ka chamakta kinara */
      inset 0 -6px 10px rgba(0,0,0,.35),       /* neeche ka andhera */
      0 12px 0 var(--edge),                     /* button ki height (3D side) */
      0 20px 28px rgba(0,0,0,.6);              /* zameen par parchhai */
    transform: translateY(0);
    transition: transform .08s ease-out, box-shadow .08s ease-out, filter .15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active, .btn.pressed {
    transform: translateY(10px);               /* button neeche dab gaya */
    filter: brightness(.95);
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,.45),
      inset 0 -2px 0 rgba(255,255,255,.08),
      0 2px 0 var(--edge),
      0 6px 10px rgba(0,0,0,.6);
  }
  .btn:focus-visible { outline: 3px solid var(--neon-cyan); outline-offset: 6px; }
  .btn img { width: clamp(70px, 18vw, 130px); height: auto; filter: drop-shadow(0 4px 3px rgba(0,0,0,.45)); pointer-events: none; }
  .btn .label { font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 800; letter-spacing: .06em; text-shadow: 0 2px 2px rgba(0,0,0,.6); }
  /* "Recommended" / "Warning": size original wala, bas font bold + bright white taaki door se saaf dikhe */
  .btn .sub {
    font-size: clamp(.7rem, 2.4vw, 1rem);
    font-weight: 800;
    letter-spacing: .08em;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }

  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }

  /* patli screen (phone) par buttons ko lamba hone se roko */
  @media (max-width: 560px) {
    .btn {
      min-height: 0;              /* vh wali lambai band */
      aspect-ratio: 4 / 5;        /* chaude ke hisaab se height, isliye zyada lamba nahi hoga */
      padding: 14px 6px;
      gap: 8px;
      border-radius: 18px;
    }
    .btn img { width: clamp(52px, 20vw, 90px); }
    .btn .label { font-size: clamp(1.05rem, 5.5vw, 1.5rem); }
    .btn .sub { font-size: clamp(.6rem, 2.9vw, .8rem); letter-spacing: .03em; }
  }

  /* ====== Spin popup ====== */
  .modal {
    position: fixed; inset: 0; z-index: 10;
    display: none; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(0,0,0,.78);
  }
  .modal.open { display: flex; }
  .modal-box {
    width: 100%; max-width: 520px;
    padding: 28px 20px 24px;
    text-align: center;
    background: linear-gradient(180deg, #1a1440 0%, #0b0620 100%);
    border: 2px solid var(--neon-cyan);
    border-radius: 22px;
  }
  .modal-title { font-size: clamp(1.3rem, 5vw, 2rem); font-weight: 800; letter-spacing: .06em; margin-bottom: 18px; }
  .reel {
    position: relative;
    height: 240px;                      /* JS screen ke hisaab se set karta hai (3 rows) */
    overflow: hidden;
    border-radius: 14px;
    border: 2px solid #2a3350;
    background: #000;
  }
  /* upar aur neeche wali rows ka text dull (beech wali normal rehti hai) */
  .reel::before, .reel::after {
    content: ""; position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none;
    height: 33.333%;
    background: rgba(0,0,0,.55);        /* dull kam/zyada karna ho to .55 badlo */
  }
  .reel::before { top: 0; }
  .reel::after { bottom: 0; }
  /* beech wali row (jo aaya) ke left mein ">" aur right mein "<" */
  .reel-focus {
    position: absolute; left: 0; right: 0; top: 33.333%; height: 33.333%; z-index: 2; pointer-events: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 10px;
    font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 800; color: var(--neon-cyan);
  }
  .reel-focus::before { content: ">"; }
  .reel-focus::after  { content: "<"; }
  .reel-strip { will-change: transform; }
  .reel-item {
    display: flex; align-items: center; justify-content: center;
    padding: 0 44px;                    /* arrows ke liye jagah */
    font-size: clamp(1rem, 3.8vw, 1.5rem);
    font-weight: 600; line-height: 1.25;
    text-wrap: balance; overflow-wrap: anywhere;
  }
  .spin-btn {
    width: 100%; margin-top: 22px; padding: 14px;
    font-family: inherit; font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 800; letter-spacing: .06em;
    color: #cfd6ea; background: #3a4560;
    border: none; border-radius: 14px;
    cursor: default;
  }
  .spin-btn { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .spin-btn.ready {
    color: #fff; background: #ff4500; cursor: pointer;
    position: relative; overflow: hidden;
    /* pulse + halka sa hilna taaki user ka dhyan jaye aur wo click kare */
    animation: goBackPulse 1.2s ease-in-out infinite, goBackWiggle 2.4s ease-in-out infinite;
  }
  /* chamakti hui shine patti jo button ke upar se guzarti hai */
  .spin-btn.ready::after {
    content: ""; position: absolute; top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-20deg);
    animation: goBackShine 2s ease-in-out infinite;
    pointer-events: none;
  }
  .spin-btn.ready:hover { filter: brightness(1.12); }
  .spin-btn.ready:active { transform: scale(.96); }
  /* "Stop" button: spinner ghoomte waqt dikhta hai */
  .spin-btn.stop {
    color: #fff; background: #e53935; cursor: pointer;
    box-shadow: 0 6px 0 #8e1b1b;
    transition: transform .08s ease-out, box-shadow .08s ease-out, filter .15s;
  }
  .spin-btn.stop:hover { filter: brightness(1.12); }
  .spin-btn.stop:active { transform: translateY(4px); box-shadow: 0 2px 0 #8e1b1b; }
  @keyframes goBackPulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(255,69,0,.7); }
    50%      { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(255,69,0,0); }
  }
  @keyframes goBackWiggle {
    0%, 80%, 100% { rotate: 0deg; }
    85% { rotate: -2deg; }
    90% { rotate: 2deg; }
    95% { rotate: -1.5deg; }
  }
  @keyframes goBackShine {
    0%   { left: -60%; }
    60%, 100% { left: 130%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spin-btn.ready, .spin-btn.ready::after { animation: none; }
  }
  .spin-btn img { height: 1.6em; width: auto; display: block; }
  .spin-btn svg { height: 1.8em; width: auto; display: block; flex: none; }
</style>
</head>

  <svg id="joystick" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Joystick"><path fill="#E53935" d="M32.87 82.05H19.85c-1.77 0-3.21 1.44-3.21 3.21v5.09c0 1.77 1.44 3.21 3.21 3.21h13.02c1.77 0 3.21-1.44 3.21-3.21v-5.09c0-1.78-1.44-3.21-3.21-3.21z"/><path fill="#424242" d="M32.87 84.05c.67 0 1.21.54 1.21 1.21v5.09c0 .67-.54 1.21-1.21 1.21H19.85c-.67 0-1.21-.54-1.21-1.21v-5.09c0-.67.54-1.21 1.21-1.21h13.02m0-2H19.85c-1.77 0-3.21 1.44-3.21 3.21v5.09c0 1.77 1.44 3.21 3.21 3.21h13.02c1.77 0 3.21-1.44 3.21-3.21v-5.09c0-1.78-1.44-3.21-3.21-3.21z" opacity=".2"/><path fill="#0D47A1" d="M32.02 112.04H16.33c-2.21 0-4 1.79-4 4v4.1c0 2.21 1.79 4 4 4h16.35a5.99 5.99 0 0 0 5.1-2.85l3.24-5.25s-6.79-4-9-4zm80 0h-15.7c-2.21 0-9 4-9 4l3.24 5.25a5.99 5.99 0 0 0 5.1 2.85h16.35c2.21 0 4-1.79 4-4v-4.1c.01-2.21-1.78-4-3.99-4z"/><path fill="#424242" d="M32.02 114.04c.76.02 3.43 1.2 6.21 2.72l-2.15 3.48a3.971 3.971 0 0 1-3.4 1.9H16.33c-1.1 0-2-.9-2-2v-4.1c0-1.1.9-2 2-2h15.69m0-2H16.33c-2.21 0-4 1.79-4 4v4.1c0 2.21 1.79 4 4 4h16.35a5.99 5.99 0 0 0 5.1-2.85l3.24-5.25s-6.79-4-9-4zm80 2c1.1 0 2 .9 2 2v4.1c0 1.1-.9 2-2 2H95.67c-1.4 0-2.67-.71-3.4-1.9l-2.15-3.48c2.78-1.52 5.45-2.7 6.21-2.72h15.69m0-2h-15.7c-2.21 0-9 4-9 4l3.24 5.25a5.99 5.99 0 0 0 5.1 2.85h16.35c2.21 0 4-1.79 4-4v-4.1c.01-2.21-1.78-4-3.99-4z" opacity=".2"/><g class="stick"><path fill="#eee" d="M58 43.68h12v65.36H58z"/><g opacity=".2"><path fill="#eee" d="M59.5 45.18h9v62.36h-9z"/><path fill="#424242" d="M67 46.68v59.36h-6V46.68h6m3-3H58v65.36h12V43.68z"/></g></g><path fill="#616161" d="M70.34 72.05H57.66a78.066 78.066 0 0 0-20.85 27.33l-.28.62h54.94l-.39-.85a77.275 77.275 0 0 0-20.74-27.1z"/><path fill="#616161" d="M69.24 75.05A74.597 74.597 0 0 1 86.68 97H41.33a75.645 75.645 0 0 1 17.44-21.95h10.47m1.1-3H57.66a78.066 78.066 0 0 0-20.85 27.33l-.28.62h54.94l-.39-.85a77.275 77.275 0 0 0-20.74-27.1z" opacity=".2"/><linearGradient id="cvea" x1="64" x2="64" y1="72.333" y2="119.69" gradientUnits="userSpaceOnUse"><stop offset=".122" stop-color="#42A5F5"/><stop offset=".886" stop-color="#1E88E5"/></linearGradient><path fill="url(#cvea)" d="M116 88.42H12c-4.42 0-8 3.58-8 8v15.49c0 4.42 3.58 8 8 8h104c4.42 0 8-3.58 8-8V96.42c0-4.41-3.58-8-8-8z"/><radialGradient id="cveb" cx="60.833" cy="23" r="23.552" gradientUnits="userSpaceOnUse"><stop offset=".171" stop-color="#EF5350"/><stop offset=".557" stop-color="#E53935"/></radialGradient><g class="stick"><circle cx="64.31" cy="27.43" r="23" fill="url(#cveb)"/><path fill="#424242" d="M64.31 7.43c11.03 0 20 8.97 20 20s-8.97 20-20 20-20-8.97-20-20 8.97-20 20-20m0-3c-12.7 0-23 10.3-23 23s10.3 23 23 23 23-10.3 23-23-10.3-23-23-23z" opacity=".2"/></g><path fill="#424242" d="M116 91.42c2.76 0 5 2.24 5 5v15.49c0 2.76-2.24 5-5 5H12c-2.76 0-5-2.24-5-5V96.42c0-2.76 2.24-5 5-5h104m0-3H12c-4.42 0-8 3.58-8 8v15.49c0 4.42 3.58 8 8 8h104c4.42 0 8-3.58 8-8V96.42c0-4.41-3.58-8-8-8z" opacity=".2"/></svg>

<div class="modal" id="spinModal">
  <div class="modal-box">
    <div class="modal-title">You rolled...</div>
    <div class="reel" id="reel"><div class="reel-strip" id="reelStrip"></div><div class="reel-focus"></div></div>
    <button class="spin-btn" id="spinBtn" disabled>Spinning...</button>
  </div>
</div>

<script>
 // ====== Stars background ======
  (function () {
    const cv = document.getElementById('stars'), c = cv.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W, H, stars = [];
    function init() {
      const dpr = window.devicePixelRatio || 1;
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.round(W * H / 5000);          // stars ki ginti (kam/zyada ke liye 5000 badlo)
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,               // size
        v: Math.random() * 8 + 3,                   // speed (px/sec) - bahut slow
        a: Math.random() * 0.6 + 0.3,               // brightness
        t: Math.random() * 6.28                     // halka twinkle
      }));
    }
    let last = performance.now();
    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.1); last = now;
      c.clearRect(0, 0, W, H);
      for (const s of stars) {
        if (!reduce) { s.x += s.v * dt; s.t += dt; if (s.x > W + 2) { s.x = -2; s.y = Math.random() * H; } }
        c.globalAlpha = s.a * (0.75 + 0.25 * Math.sin(s.t));
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.283); c.fill();
      }
      requestAnimationFrame(frame);
    }
    addEventListener('resize', init);
    init(); requestAnimationFrame(frame);
  })();

  // ====== Yahan se title change karo ======
  const GAME_TITLE = "Choose One";
  // ========================================

  const titleEl = document.getElementById('title');
  titleEl.textContent = GAME_TITLE;
  document.title = GAME_TITLE;


  // physical button jaisa "click" awaaz + vibration
  let ctx;
  function clickSound() {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(180, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.06);
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      o.connect(g).connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.09);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(15);
  }
  document.querySelectorAll('.btn').forEach(b => {
    b.addEventListener('pointerdown', clickSound);
    b.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { b.classList.add('pressed'); clickSound(); } });
    b.addEventListener('keyup', () => b.classList.remove('pressed'));
  });

  // ====== Yahan apne sentences likho (ek line mein ek sentence) ======
  const EASY_SENTENCES = [
    "Easy sentence 1",
    "Easy sentence 2",
    "Easy sentence 3",
    "Easy sentence 4",
    "Easy sentence 5",
  ];
  const HARD_SENTENCES = [
    "Hard sentence 1",
    "Hard sentence 2",
    "Hard sentence 3",
    "Hard sentence 4",
    "Hard sentence 5",
  ];
  // ===================================================================

  // "Go back to" ke baad jo image/SVG dikhani ho uska path ya data URI yahan daalo ("" = kuch nahi)
  const GO_BACK_IMAGE = "";

  // ====== Yahan apni Reddit post ka URL daalo ======
  // "Go Back - Reddit" button dabane par user isi link par redirect hoga
  const REDDIT_POST_URL = "https://www.reddit.com/r/YOUR_SUBREDDIT/comments/YOUR_POST_ID/";
  // true = nayi tab mein khulega, false = isi tab mein redirect hoga
  const OPEN_IN_NEW_TAB = false;
  // =================================================

  const modal = document.getElementById('spinModal');
  const reel = document.getElementById('reel');
  const strip = document.getElementById('reelStrip');
  const spinBtn = document.getElementById('spinBtn');
  let currentMode = null, currentResult = null;

  // ====== Spinner settings ======
  // spinner "Stop" dabane tak lagatar ghoomta rahega
  const SPIN_SPEED = 1400;   // ghoomne ki speed (px/sec) - tez/dheema karna ho to badlo
  const STOP_FILLERS = 3;    // rukne se pehle kitni extra rows aur guzrengi
  // ==============================

  let spinState = 'idle';    // idle | spinning | stopping | done
  let rafId = null;
  let spinList = [], spinPos = 0, cycleH = 0, rowH = 0;

  const prefersReduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const randItem = list => list[Math.floor(Math.random() * list.length)];
  const pickOther = (list, not) => {
    if (list.length < 2) return list[0];
    let t; do { t = randItem(list); } while (t === not);
    return t;
  };
  const shuffled = list => list.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(p => p[1]);

  function addRow(text) {
    const d = document.createElement('div');
    d.className = 'reel-item';
    d.style.height = rowH + 'px';
    d.textContent = text;
    strip.appendChild(d);
  }

  // "Stop" button ke andar dikhne wala haath (hand) ka SVG - rang text ke hisaab se (currentColor)
  const STOP_HAND_SVG =
    '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
      '<rect x="6.5" y="3" width="2.6" height="11" rx="1.3"/>' +
      '<rect x="9.6" y="1.5" width="2.6" height="12.5" rx="1.3"/>' +
      '<rect x="12.7" y="2.5" width="2.6" height="11.5" rx="1.3"/>' +
      '<rect x="15.8" y="5" width="2.4" height="9.5" rx="1.2"/>' +
      '<rect x="6.5" y="10" width="11.7" height="10" rx="4.5"/>' +
      '<rect x="4" y="10.5" width="3.2" height="8" rx="1.6" transform="rotate(-15 6.5 17.5)"/>' +
      '<rect x="5.2" y="14" width="5.5" height="5.5" rx="1.5"/>' +
    '</svg>';

  // button ki halat: 'stop' (ghoom raha hai) / 'stopping' (ruk raha hai) / 'ready' (Go Back - Reddit)
  function setBtn(kind) {
    spinBtn.classList.remove('ready', 'stop');
    spinBtn.textContent = '';
    if (kind === 'stop') {
      spinBtn.innerHTML = '<span>Stop</span>' + STOP_HAND_SVG;
      spinBtn.disabled = false;
      spinBtn.classList.add('stop');
    } else if (kind === 'stopping') {
      spinBtn.textContent = 'Stopping...';
      spinBtn.disabled = true;
    } else {
      // "Go back to" + (agar GO_BACK_IMAGE di ho to wo image)
      const t = document.createElement('span');
      t.textContent = 'Go Back - Reddit';
      spinBtn.appendChild(t);
      if (GO_BACK_IMAGE) {
        const im = document.createElement('img');
        im.src = GO_BACK_IMAGE;
        im.alt = '';
        spinBtn.appendChild(im);
      }
      spinBtn.disabled = false;
      spinBtn.classList.add('ready');
    }
  }

  function openSpin(mode, list) {
    cancelAnimationFrame(rafId);
    currentMode = mode;
    currentResult = randItem(list);
    spinList = list;
    spinState = 'spinning';
    modal.classList.add('open');

    // reel 3 rows dikhata hai: pehle wala, jo aaya (beech mein highlight), baad wala
    rowH = Math.max(64, Math.min(84, Math.round(innerHeight * 0.12)));      // ek row ki height
    reel.style.height = (rowH * 3 + 4) + 'px';                               // +4 = border

    // ek "chakra" (cycle) do baar likhte hain, taaki ghoomna beech mein kabhi na tute
    const cycle = [];
    while (cycle.length < 10) cycle.push(...shuffled(list));
    cycleH = cycle.length * rowH;
    strip.innerHTML = '';
    cycle.forEach(addRow);
    cycle.forEach(addRow);

    spinPos = 0;
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    setBtn('stop');

    if (prefersReduced()) return;        // reduced motion: ghoomega nahi, Stop par seedha result

    let last = performance.now();
    const tick = now => {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      spinPos = (spinPos + SPIN_SPEED * dt) % cycleH;
      strip.style.transform = 'translateY(' + (-spinPos) + 'px)';
      rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  }

  function stopSpin() {
    if (spinState !== 'spinning') return;
    spinState = 'stopping';
    cancelAnimationFrame(rafId);
    setBtn('stopping');

    // aage ki rows: kuch filler, phir result se pehle wala, result (beech mein rukega), baad wala
    const base = strip.children.length;
    for (let i = 0; i < STOP_FILLERS; i++) addRow(randItem(spinList));
    addRow(pickOther(spinList, currentResult));
    addRow(currentResult);
    addRow(pickOther(spinList, currentResult));
    const target = (base + STOP_FILLERS) * rowH;

    const finish = () => { spinState = 'done'; setBtn('ready'); };

    if (prefersReduced()) {
      strip.style.transform = 'translateY(' + (-target) + 'px)';
      finish();
      return;
    }

    // jis speed se ghoom raha tha usi se shuru hoke dheere dheere rukta hai
    const from = spinPos, dist = target - from;
    const dur = Math.min(4500, Math.max(1800, 3 * dist / SPIN_SPEED * 1000));
    const t0 = performance.now();
    const step = now => {
      const p = Math.min((now - t0) / dur, 1);
      const e = 1 - Math.pow(1 - p, 3);                  // ease-out
      strip.style.transform = 'translateY(' + (-(from + dist * e)) + 'px)';
      if (p < 1) rafId = requestAnimationFrame(step);
      else finish();
    };
    rafId = requestAnimationFrame(step);
  }

  spinBtn.addEventListener('click', () => {
    if (spinBtn.disabled) return;
    if (spinState === 'spinning') { stopSpin(); return; }   // "Stop" dabaya
    if (spinState !== 'done') return;
    if (!REDDIT_POST_URL) return;
    spinBtn.disabled = true;                 // dobara click na ho
    spinBtn.textContent = 'Redirecting...';
    // thoda ruk ke redirect, taaki "Redirecting..." likha dikh sake
    setTimeout(() => {
      if (OPEN_IN_NEW_TAB) {
        window.open(REDDIT_POST_URL, '_blank', 'noopener');
        spinBtn.disabled = false;
        spinBtn.textContent = 'Go Back - Reddit';
      } else {
        window.location.href = REDDIT_POST_URL;
      }
    }, 600);
  });

  document.getElementById('easyBtn').addEventListener('click', () => openSpin('easy', EASY_SENTENCES));
  document.getElementById('hardBtn').addEventListener('click', () => openSpin('hard', HARD_SENTENCES));
</script>
