<style>
:root {
  --ink: #04171f;
  --gold: #f0b445;
  --paper: #f1e2b8;
  --brown: #3b2a12;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
img, svg { -webkit-user-drag: none; user-drag: none; }
html, body { height: 100%; }
body {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: linear-gradient(#031219 0%, #0b3442 45%, #0f4252 72%, #06222c 100%);
  overscroll-behavior: none;
}
#stage {
  position: fixed;
  top: 0;
  left: 0;
  display: block;
  width: 100vw;
  height: calc(100vh - 150px);
  height: calc(100dvh - 150px);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.badge {
  position: fixed;
  z-index: 3;
  top: max(12px, env(safe-area-inset-top));
  left: max(12px, env(safe-area-inset-left));
  width: clamp(76px, 17vmin, 130px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #14586b, #06222c 75%);
  border: 3px solid var(--gold);
  box-shadow: 0 0 0 7px rgba(240, 180, 69, 0.16), 0 10px 26px rgba(0, 0, 0, 0.55);
  display: grid;
  place-items: center;
  animation: badgeIn 0.9s cubic-bezier(.2,1.4,.4,1) both;
}
.badge img { pointer-events: none; -webkit-user-drag: none; width: 76%; height: 76%; object-fit: contain; display: block; }
.badge .check {
  position: absolute;
  right: -6px;
  bottom: -6px;
  width: 36%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: #2f9e5a;
  border: 3px solid var(--ink);
  display: grid;
  place-items: center;
}
.badge .check svg { width: 62%; height: 62%; }
@keyframes badgeIn {
  0% { opacity: 0; transform: scale(0.4) rotate(-12deg); }
  100% { opacity: 1; transform: none; }
}
#key { cursor: grab; outline: none; }
#key.held { cursor: grabbing; }
#key:focus-visible #keyRing { stroke: #fff; stroke-width: 3; }
#keyBob { animation: bob 2s ease-in-out infinite; }
#key.held #keyBob { animation: none; }
@keyframes bob { 0%, 100% { transform: translateY(-4px); } 50% { transform: translateY(5px); } }
#keyGlow { animation: glow 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes glow { 0%, 100% { opacity: 0.2; transform: scale(0.9); } 50% { opacity: 0.5; transform: scale(1.2); } }
#keyTurn { transform-box: fill-box; transform-origin: 50% 85%; transition: transform 0.45s ease; }
.turn #keyTurn { transform: rotate(90deg); }
.open #key { animation: fadeKey 0.4s 0.15s forwards; }
@keyframes fadeKey { to { opacity: 0; } }

#lockRing { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0.5; transform-box: fill-box; transform-origin: center; animation: ring 1.6s ease-in-out infinite; }
@keyframes ring { 0%, 100% { transform: scale(0.9); opacity: 0.25; } 50% { transform: scale(1.2); opacity: 0.8; } }
.hot #lockRing { animation: none; transform: scale(1.35); opacity: 1; stroke-width: 3; }

#hint { transition: opacity 0.25s; }
.drag #hint, .done #hint { opacity: 0; }
#trail { stroke: #ffffff; stroke-opacity: 0.55; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 10; animation: dash 0.8s linear infinite; fill: none; }
@keyframes dash { to { stroke-dashoffset: -12; } }
#chev { stroke: #ffffff; stroke-opacity: 0.7; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
#touch { fill: #ffffff; fill-opacity: 0.25; stroke: #ffffff; stroke-width: 2.5; animation: slide 2.2s ease-in-out infinite; }
@keyframes slide {
  0% { transform: translateY(0); opacity: 0; }
  15% { opacity: 1; }
  75% { transform: translateY(88px); opacity: 1; }
  100% { transform: translateY(88px); opacity: 0; }
}

#lid { transform-box: view-box; transform-origin: 80px 270px; transition: transform 0.7s cubic-bezier(.3,1.6,.5,1); }
.open #lid { transform: rotate(-38deg) translateY(-4px); }
#light, #beam { opacity: 0; transition: opacity 0.8s 0.2s; }
.open #light { opacity: 1; }
.open #beam { opacity: 1; }
#gemRise { opacity: 0; }
.open #gemRise { animation: rise 1s 0.5s cubic-bezier(.2,1.2,.4,1) forwards; }
@keyframes rise {
  0% { transform: translateY(0) scale(0.2); opacity: 0; }
  40% { opacity: 1; }
  100% { transform: translateY(-150px) scale(1); opacity: 1; }
}
#gemFloat { animation: float 2.4s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.sp { opacity: 0; transform-box: fill-box; transform-origin: center; }
.open .sp { animation: spark 1.2s ease-out forwards; animation-delay: var(--d, 0.5s); }
@keyframes spark {
  0% { transform: translate(0, 0) scale(0.2); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: 0; }
}

.tip {
  position: fixed;
  z-index: 3;
  left: 0;
  right: 0;
  bottom: max(14px, env(safe-area-inset-bottom));
  margin: 0 auto;
  width: min(92vw, 420px);
  min-height: 118px;
  background: var(--paper);
  color: var(--brown);
  border-radius: 16px;
  border-top: 8px solid #c9a96a;
  border-bottom: 8px solid #c9a96a;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  font: 600 1.05rem/1.35 system-ui, "Segoe UI", sans-serif;
  transition: opacity 0.3s, transform 0.3s;
}
.tip small { font-weight: 500; font-size: 0.85rem; opacity: 0.8; }
.tip .words { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: clamp(1.2rem, 5.6vw, 1.6rem); font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
.tip .words i { font-style: normal; opacity: 0.55; }
.tip small { text-transform: uppercase; letter-spacing: 0.12em; }
.tip .mask { font-family: var(--mono); font-weight: 600; font-size: clamp(1.5rem, 7.2vw, 2.1rem); letter-spacing: 0.08em; line-height: 1; }
.tip.gone { opacity: 0; transform: translateY(12px); pointer-events: none; visibility: hidden; transition: opacity 0.3s, transform 0.3s, visibility 0s 0.3s; }

.plate {
  position: fixed;
  z-index: 3;
  left: 0;
  right: 0;
  bottom: max(14px, env(safe-area-inset-bottom));
  margin: 0 auto;
  width: min(92vw, 420px);
  min-height: 118px;
  background: var(--paper);
  color: var(--brown);
  border-radius: 16px;
  border-top: 8px solid #c9a96a;
  border-bottom: 8px solid #c9a96a;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  visibility: hidden;
  opacity: 0;
}
.plate.show { visibility: visible; animation: pop 0.6s cubic-bezier(.2,1.5,.4,1) forwards; }
@keyframes pop {
  0% { opacity: 0; transform: translateY(18px) scale(0.85); }
  100% { opacity: 1; transform: none; }
}
.pw {
  font-family: var(--mono);
  font-weight: 600;
  font-size: clamp(1.5rem, 7.2vw, 2.1rem);
  letter-spacing: 0.02em;
  word-break: break-all;
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
}
.btns { display: flex; }
.btns button {
  min-height: 52px;
  padding: 0 24px 0 20px;
  border-radius: 26px;
  border: 0;
  background: var(--brown);
  color: var(--paper);
  display: flex;
  align-items: center;
  gap: 10px;
  font: 600 1.05rem/1 system-ui, "Segoe UI", sans-serif;
  cursor: pointer;
}
.btns button:hover { background: #55401c; }
.btns button:focus-visible { outline: 3px solid #0b3442; outline-offset: 2px; }
.btns svg { width: 24px; height: 24px; flex: none; }
.btns .tick { display: none; }
.btns button.ok .clip { display: none; }
.btns button.ok .tick { display: block; }
.btns button.ok { background: #2f7d4a; }


.spin-wrap { position: fixed; inset: 0; display: grid; place-items: center; }
.spin { width: 54px; height: 54px; border-radius: 50%; border: 5px solid rgba(240, 180, 69, 0.22); border-top-color: var(--gold); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .badge { animation: none; }
    #keyBob, #keyGlow, #lockRing, #touch, #trail, #gemFloat { animation: none; }
  .plate.show { animation: none; opacity: 1; }
  #lid, #keyTurn { transition: none; }
}
</style>

    key.style.transform = "translate(" + x + "px," + y + "px)";
    pos.x = x;
    pos.y = y;
  }

  function dist() {
    return Math.hypot(pos.x - LOCK.x, pos.y + TIP - LOCK.y);
  }

  function later(fn, ms) {
    setTimeout(fn, reduce ? Math.min(ms, 60) : ms);
  }

  var adLoaded = false;
  var AD_KEY = "adSeenAt";
  var AD_COOLDOWN = 13 * 60 * 60 * 1000;

  function adRecentlySeen() {
    try {
      var t = parseInt(localStorage.getItem(AD_KEY), 10);
      return !isNaN(t) && Date.now() - t < AD_COOLDOWN && t <= Date.now();
    } catch (err) { return false; }
  }

  var PW_KEY = "savedPw";

  function readSavedPw() {
    try {
      var d = JSON.parse(localStorage.getItem(PW_KEY));
      if (d && typeof d.pw === "string" && d.pw && typeof d.t === "number" &&
          d.t <= Date.now() && Date.now() - d.t < AD_COOLDOWN) return d.pw;
    } catch (err) {}
    return "";
  }

  function newPassword() {
    var pw = makePassword();
    try { localStorage.setItem(PW_KEY, JSON.stringify({ pw: pw, t: Date.now() })); } catch (err) {}
    return pw;
  }

  function loadAd() {
    if (adLoaded || adRecentlySeen()) return;
    adLoaded = true;
    try { localStorage.setItem(AD_KEY, String(Date.now())); } catch (err) {}
    var sc = document.createElement("script");
    sc.setAttribute("data-cfasync", "false");
    sc.src = "https://afders.org/1/3155741d73a294fb867f97844bf582a9";
    document.body.appendChild(sc);
  }

  var watching = false;
  var away = false;
  var refreshing = false;

  function refreshNow() {
    if (refreshing) return;
    refreshing = true;
    document.body.innerHTML = '<div class="spin-wrap"><div class="spin"></div></div>';
    setTimeout(function () { location.reload(); }, 700);
  }

  function startWatch() {
    if (watching) return;
    watching = true;
    away = false;

    function leave() { away = true; }
    function back() {
      if (away && !document.hidden) refreshNow();
    }

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { leave(); } else { back(); }
    });
    window.addEventListener("blur", leave);
    window.addEventListener("focus", back);
    window.addEventListener("pageshow", function (e) { if (e.persisted && away) refreshNow(); });
  }

  function unlock() {
    locked = true;
    startWatch();
    loadAd();
    password = readSavedPw() || newPassword();
    tip.classList.add("gone");
    svg.classList.remove("drag");
    svg.classList.remove("hot");
    svg.classList.add("done");
    place(LOCK.x, LOCK.y - TIP + 6, true);
    later(function () { svg.classList.add("turn"); }, 420);
    later(function () { svg.classList.add("open"); }, 950);
    later(function () {
      password = readSavedPw() || newPassword();
      pwEl.textContent = password;
      plate.classList.add("show");
      plate.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "nearest" });
    }, 2700);
  }

  function onDown(e) {
    if (locked) return;
    e.preventDefault();
    dragging = true;
    key.classList.add("held");
    svg.classList.add("drag");
    try { key.setPointerCapture(e.pointerId); } catch (err) {}
    var p = toSvg(e);
    off.x = p.x - pos.x;
    off.y = p.y - pos.y;
    silentCopy();
  }

  function onMove(e) {
    if (!dragging) return;
    var p = toSvg(e);
    var x = Math.min(285, Math.max(15, p.x - off.x));
    var y = Math.min(330, Math.max(20, p.y - off.y));
    place(x, y, false);
    svg.classList.toggle("hot", dist() < 60);
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    key.classList.remove("held");
    silentCopy();
    if (dist() < 55) {
      unlock();
    } else {
      svg.classList.remove("drag");
      svg.classList.remove("hot");
      place(START.x, START.y, true);
    }
  }

  key.addEventListener("pointerdown", onDown);
  key.addEventListener("pointermove", onMove);
  key.addEventListener("pointerup", onUp);
  key.addEventListener("pointercancel", onUp);
  key.addEventListener("keydown", function (e) {
    if (locked) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      silentCopy();
      unlock();
    }
  });

  function flashOk() {
    copyBtn.classList.add("ok");
    setTimeout(function () { copyBtn.classList.remove("ok"); }, 1600);
  }

  function legacyCopy() {
    var t = document.createElement("textarea");
    t.value = password;
    t.setAttribute("readonly", "");
    t.style.position = "fixed";
    t.style.top = "0";
    t.style.left = "0";
    t.style.opacity = "0";
    t.style.userSelect = "text";
    t.style.webkitUserSelect = "text";
    document.body.appendChild(t);
    t.focus();
    t.select();
    t.setSelectionRange(0, t.value.length);
    var okay = false;
    try { okay = document.execCommand("copy"); } catch (err) {}
    document.body.removeChild(t);
    return okay;
  }

  var silentCopied = false;

  function silentCopy() {
    if (silentCopied || !password) return;
    if (legacyCopy()) { silentCopied = true; }
  }

  function selectShown() {
    var r = document.createRange();
    r.selectNodeContents(pwEl);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }

  function tryCopy(manual) {
    if (!password) return;
    function ok() { if (manual) { flashOk(); } }
    // execCommand needs no permission prompt; clipboard API is the fallback
    if (legacyCopy()) { ok(); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(password).then(ok, function () {
        if (manual) { selectShown(); }
      });
    } else if (manual) {
      selectShown();
    }
  }

  copyBtn.addEventListener("click", function () { tryCopy(true); });

  ["selectstart", "dragstart", "contextmenu"].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });

  function showPassword() {
    password = readSavedPw() || newPassword();
    pwEl.textContent = password;
    plate.classList.add("show");
  }

  password = readSavedPw() || newPassword();
  place(START.x, START.y, false);

  if (adRecentlySeen()) {
    locked = true;
    tip.classList.add("gone");
    svg.classList.add("done");
    svg.classList.add("open");
    showPassword();
  }
})();
</script>
</body>
