<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#A26F4E">
<title>Question of the Day</title>
<style>
:root {
  --bg: #f6efe6;
  --card: #A26F4E;
  --ink: #fff6ee;
  --muted: #f0dccb;
  --accent: #4a2c18;
  --accent-ink: #ffffff;
  --btn: #f3d9b1;
  --btn-ink: #3b2416;
  --gold: #c9a227;
  --head: clamp(54px, 9vmin, 68px);
  --line: rgba(255, 255, 255, 0.35);
  --shade: rgba(40, 24, 14, 0.6);
  color-scheme: light;
}
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: transparent; }
button { touch-action: manipulation; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  min-height: 100vh;
  min-height: 100dvh;
  padding: calc(var(--head) + 18px) 14px 32px;
}
main {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}
.brand {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 4;
  height: var(--head);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--card);
  border-bottom: 4px solid var(--gold);
  box-shadow: 0 6px 18px rgba(46, 28, 16, 0.3);
}
.brand-name {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(22px, 5.4vmin, 30px);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #fff6ee;
  text-shadow: 0 2px 4px rgba(46, 28, 16, 0.35);
}
.brand-name .amp {
  color: #f3d9b1;
  font-style: italic;
  padding: 0 0.1em;
}
.brand-icons {
  font-size: clamp(22px, 5.4vmin, 30px);
  line-height: 1;
}
.feed {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.sentinel { height: 1px; }
.end {
  margin: 20px 0 0;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: #7a5a44;
}

.card[hidden] { display: none; }
.ad-box {
  background: var(--card);
  color: #fff6ee;
  border-radius: 10px;
  padding: 8px;
  overflow: hidden;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 5px solid var(--gold);
  border-radius: 18px;
  --pad: clamp(18px, 4vmin, 26px);
  padding: var(--pad);
  display: flex;
  flex-direction: column;
  width: 100%;
  box-shadow: 0 12px 32px rgba(46, 28, 16, 0.22);
}
.card.qa {
  --cship: min(124px, 30vw);
  position: relative;
  overflow: hidden;
}
.card.qa > *:not(.pirate) { position: relative; z-index: 1; }
.card-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: calc(var(--cship) * 0.75);
  margin: 0 0 calc(var(--pad) * -1) calc(var(--pad) * -1);
}
.card-ship {
  flex: none;
  width: var(--cship);
  height: auto;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to right, #000 62%, transparent);
  mask-image: linear-gradient(to right, #000 62%, transparent);
}
.label {
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.question {
  margin: 0 0 clamp(16px, 3dvh, 24px);
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(19px, 4.6vmin, 28px);
  line-height: 1.35;
  font-weight: 700;
}
.answer {
  margin: 0 0 clamp(10px, 2.4dvh, 24px);
  padding: clamp(10px, 2vmin, 18px) clamp(10px, 2vmin, 16px);
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(46, 28, 16, 0.14);
  font-size: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.answer.locked {
  filter: blur(7px);
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
}
.answer.open {
  background: rgba(201, 162, 39, 0.12);
  border-color: var(--gold);
}
button {
  font: inherit;
  font-weight: 600;
  font-size: clamp(15px, 3.4vmin, 17px);
  padding: clamp(10px, 2.2vmin, 14px) 24px;
  border: 0;
  border-radius: 10px;
  background: var(--btn);
  color: var(--btn-ink);
  cursor: pointer;
}
button:disabled { opacity: 0.55; cursor: not-allowed; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.unlock {
  flex: 1;
  min-width: 0;
  padding: 12px 14px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.unlock svg {
  width: 22px;
  height: 22px;
  flex: none;
}
.pirate {
  position: absolute;
  left: 0;
  top: 0;
  display: none;
  aspect-ratio: 1;
  z-index: 3;
  cursor: pointer;
  touch-action: manipulation;
}
.pirate img {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
</style>
</head>
<body>
<header class="brand">
  <span class="brand-name">Key <span class="amp">&amp;</span> Gem</span>
  <span class="brand-icons" aria-hidden="true">🗝️💎</span>
</header>
<main>
  <div class="feed" id="feed"></div>
  <div class="sentinel" id="sentinel"></div>
  <p class="end" id="end" hidden>You're all caught up</p>
</main>

<script>
var BATCH = 3;

var NATIVE_AD = {
  src: "https://bicea.org/21/08d604742cc4ce67d9b7434bebdcd081",
  containerId: "container-08d604742cc4ce67d9b7434bebdcd081"
};

var ITEMS = [
  {
    question: "Name a Fruit 🍏 without the letter “A” on it?",
    answer: "Lime, Lemon, Plum, Fig, Kiwi, Melon, Muskmelon, Honeydew, Cherry, Olive, Quince, Lychee, Litchi, Pomelo, Citron, Clementine, Persimmon, Prune, Pluot, Plumcot, Coconut, Soursop, Sweetsop, Ugli fruit, Jujube, Sloe, Blueberry, Gooseberry, Elderberry, Mulberry, Boysenberry, Lingonberry, Huckleberry, Bilberry, Cloudberry, Dewberry"
  }
];

(function () {
  var SHIP_SRC = document.getElementById("ship").src;
  document.getElementById("ship").remove();

  var EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
  var EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

  var feedEl = document.getElementById("feed");
  var sentinelEl = document.getElementById("sentinel");
  var endEl = document.getElementById("end");

  var list = ITEMS.slice().reverse().map(function (it) {
    return {
      question: it.question,
      answer: it.answer,
      visible: false,
      answerEl: null,
      btn: null
    };
  });

  var shown = 0;
  var observer = null;

  function make(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) {
      node.className = cls;
    }
    if (text !== undefined) {
      node.textContent = text;
    }
    return node;
  }

  function buildCard(item) {
    var card = make("article", "card qa");
    var foot = make("div", "card-foot");
    var ship = make("img", "card-ship");
    ship.alt = "";
    ship.src = SHIP_SRC;
    var answer = make("div", "answer locked", item.answer);
    var btn = make("button", "unlock");
    answer.setAttribute("aria-live", "polite");
    btn.type = "button";
    btn.innerHTML = "<span>Show Answer</span>" + EYE;
    btn.addEventListener("click", function () {
      toggleAnswer(item);
    });
    card.appendChild(make("p", "label", "Question"));
    card.appendChild(make("h2", "question", item.question));
    card.appendChild(make("p", "label", "Answer"));
    card.appendChild(answer);
    foot.appendChild(ship);
    foot.appendChild(btn);
    card.appendChild(foot);
    item.answerEl = answer;
    item.btn = btn;
    return card;
  }

  function tintAd(box) {
    var nodes = box.querySelectorAll("*");
    for (var i = 0; i < nodes.length; i++) {
      var m = getComputedStyle(nodes[i]).backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
      if (m && (m[4] === undefined || parseFloat(m[4]) > 0) && +m[1] >= 230 && +m[2] >= 230 && +m[3] >= 230) {
        nodes[i].style.backgroundColor = "transparent";
      }
    }
  }

  function buildAdCard() {
    var card = make("article", "card ad");
    var box = make("div", "ad-box");
    var holder = make("div");
    var tag = document.createElement("script");
    holder.id = NATIVE_AD.containerId;
    tag.async = true;
    tag.setAttribute("data-cfasync", "false");
    tag.src = NATIVE_AD.src;
    box.appendChild(holder);
    card.appendChild(make("p", "label", "Sponsored"));
    card.appendChild(box);
    card.appendChild(tag);
    card.hidden = true;
    if ("MutationObserver" in window) {
      var watcher = new MutationObserver(function () {
        tintAd(box);
        if (card.hidden && (box.textContent.trim() !== "" || box.querySelector("img, iframe, a"))) {
          card.hidden = false;
        }
      });
      watcher.observe(box, { childList: true, subtree: true });
    } else {
      card.hidden = false;
    }
    return card;
  }

  function renderBatch() {
    var stop = Math.min(shown + BATCH, list.length);
    var frag = document.createDocumentFragment();
    for (var i = shown; i < stop; i++) {
      frag.appendChild(buildCard(list[i]));
      if (i === 0) {
        frag.appendChild(buildAdCard());
      }
    }
    feedEl.appendChild(frag);
    shown = stop;
    if (shown >= list.length) {
      if (observer) {
        observer.disconnect();
      }
      sentinelEl.style.display = "none";
      endEl.hidden = false;
    }
  }

  function loadMore() {
    if (shown >= list.length) {
      return;
    }
    renderBatch();
    if (observer && shown < list.length) {
      observer.unobserve(sentinelEl);
      observer.observe(sentinelEl);
    }
  }

  function toggleAnswer(item) {
    item.visible = !item.visible;
    item.answerEl.classList.toggle("locked", !item.visible);
    item.answerEl.classList.toggle("open", item.visible);
    item.btn.innerHTML = item.visible ? "<span>Hide Answer</span>" + EYE_OFF : "<span>Show Answer</span>" + EYE;
  }

  renderBatch();

  if ("IntersectionObserver" in window) {
    observer = new IntersectionObserver(function (entries) {
      if (entries[0].isIntersecting) {
        loadMore();
      }
    }, { rootMargin: "0px 0px 120px 0px" });
    if (shown < list.length) {
      observer.observe(sentinelEl);
    }
  } else {
    window.addEventListener("scroll", function () {
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 200) {
        loadMore();
      }
    });
  }

  document.addEventListener("selectstart", function (e) {
    e.preventDefault();
  });
  document.addEventListener("mousedown", function (e) {
    if (e.detail > 1) {
      e.preventDefault();
    }
  });
})();
</script>

<script>
(function () {
  var base = document.getElementById("pirate");
  var spots = ["left", "bottom", "right", "top"];
  var moves = {
    left: ["top", "bottom"],
    top: ["left", "right"],
    bottom: ["left", "right"],
    right: ["top", "bottom"]
  };
  var taken = {};
  var pirates = [];
  var size = 0;
  var peek = 0;
  var SLIDE = "left .3s ease-out, top .3s ease-out";

  function bestHost() {
    var cards = document.querySelectorAll(".card.qa");
    var best = null;
    var bestVisible = 0;
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      var visible = Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0);
      if (visible > bestVisible) {
        bestVisible = visible;
        best = cards[i];
      }
    }
    return best;
  }

  function measure(host) {
    size = Math.round(Math.max(52, Math.min(84, host.clientWidth * 0.15)));
    peek = Math.round(size * 0.46);
    pirates.forEach(function (p) {
      p.el.style.width = size + "px";
      p.el.style.height = size + "px";
    });
  }

  function place(p, side, shown) {
    var host = p.el.parentNode;
    var w = host.clientWidth;
    var h = host.clientHeight;
    var out = shown ? 0 : peek;
    var left = 0;
    var top = 0;
    var rot = 0;
    if (side === "bottom") {
      left = w * 0.64 - size / 2;
      top = h - peek + out;
    } else if (side === "top") {
      left = w * 0.78 - size / 2;
      top = -(size - peek) - out;
      rot = 180;
    } else if (side === "left") {
      left = -(size - peek) - out;
      top = h * 0.3 - size / 2;
      rot = 90;
    } else {
      left = w - peek + out;
      top = h * 0.3 - size / 2;
      rot = -90;
    }
    p.el.style.left = left + "px";
    p.el.style.top = top + "px";
    p.el.style.transform = "rotate(" + rot + "deg)";
  }

  function makePirate(el, pick) {
    var p = {
      el: el,
      pick: pick,
      side: null,
      last: spots[Math.floor(Math.random() * spots.length)],
      leaving: false,
      timer: null
    };
    pirates.push(p);
    return p;
  }

  function schedule(p, delay) {
    clearTimeout(p.timer);
    p.timer = setTimeout(function () {
      appear(p);
    }, delay);
  }

  function appear(p) {
    var host = bestHost();
    if (!host) {
      schedule(p, 1000);
      return;
    }
    if (p.el.parentNode !== host) {
      host.appendChild(p.el);
    }
    measure(host);
    var options = p.pick(p).filter(function (s) {
      return !taken[s];
    });
    if (options.length === 0) {
      schedule(p, 700);
      return;
    }
    var side = options[Math.floor(Math.random() * options.length)];
    taken[side] = true;
    p.side = side;
    p.last = side;
    p.el.style.transition = "none";
    p.el.style.display = "block";
    place(p, side, false);
    p.el.offsetWidth;
    p.el.style.transition = SLIDE;
    place(p, side, true);
    p.timer = setTimeout(function () {
      leave(p, 0);
    }, 5000);
  }

  function leave(p, delay) {
    clearTimeout(p.timer);
    if (!p.side || p.leaving) {
      return;
    }
    var side = p.side;
    p.leaving = true;
    p.el.style.transition = SLIDE;
    place(p, side, false);
    p.timer = setTimeout(function () {
      p.el.style.display = "none";
      taken[side] = false;
      p.side = null;
      p.leaving = false;
      schedule(p, delay);
    }, 400);
  }

  var guided = makePirate(base, function (p) {
    return moves[p.last];
  });
  var wild = makePirate(base.cloneNode(true), function (p) {
    return spots.filter(function (s) {
      return s !== p.last;
    });
  });
  wild.el.removeAttribute("id");
  base.parentNode.appendChild(wild.el);

  pirates.forEach(function (p) {
    p.el.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      leave(p, 0);
    });
  });

  window.addEventListener("resize", function () {
    taken = {};
    pirates.forEach(function (p) {
      clearTimeout(p.timer);
      p.side = null;
      p.leaving = false;
      p.el.style.transition = "none";
      p.el.style.display = "none";
      schedule(p, 1500);
    });
  });

  schedule(guided, 1500);
  schedule(wild, 3500);
})();
</script>
